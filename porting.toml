inputs = ["Target profile is iPadOS 17.7.11/21H461. The cached IPSW SHA-256 is c84ad24b6981a859eec499b1802be9ac593acfd3dc0a185a76d06e4d767a1451. The supplied stock boot and vendor_boot use Android header v3; their hashes are recorded in HANDOFF.md. The generated Android v3 image was accepted by elish bootloader through RAM-only fastboot boot.", "A nonzero 8-hex software identity seed was generated and stored as `unique_chip_id` in the git-ignored `/root/elish-build-20261123/UniXNU/unixnu.local.toml` with mode 0600. The value is omitted from tracked files and logs and must stay stable for subsequent builds."]
configuration = ["The shared packaging command now builds the iPadOS payload and Android v3 boot image from the runtime-managed board configuration. Build metadata continues to mark hardware testing false."]
procedure = ["Ran `./unixnu build kernel -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461` on Linux; XNU compile and XnuPrelink completed. Ran `./scripts/package.sh --check --os ipados-17.7.11-21H461`; dependency, IPSW-input, defconfig and 62-patch checks completed. The package wrapper was run with a temporary sibling symlink to the core checkout because the current workspace directories are not adjacent.", "Added support in core scripts/unixnu/bootimg.py for the documented boot_image_kernel.kernel_compression and append_dtb settings. Ran scripts/unixnu/test_bootimg.py and scripts/unixnu/test_boot_template.py on the core worktree based on revision 71c5c6569bae6369c0e0f634df8b9bd5afc19139. These core changes are uncommitted.", "The firmware-only probe image and its hash are recorded in the firmware area. Capture the UEFI runtime memory map before preparing an iPadOS payload; device-side probe execution remains pending.", "Recreated and retained /root/repo/UniXNU as a symlink to the core checkout. The normal device-repository entrypoint scripts/package.sh --check --os ipados-17.7.11-21H461 passed and resolved 62 patches without building a payload or final image.", "Ran ./scripts/package.sh --no-deps --os ipados-17.7.11-21H461 --uefi /root/repo/uefi-elish. The build resolved 63 patches and rebuilt XNU, payload, firmware and the Android v3 image.", "Ran the boot-image round-trip verifier, bootimg and boot-template tests, all 65 XnuPrelink tests, the production DarwinBoot Mach-O parser test and the 14-area porting-record check.", "Ran `fastboot -s ELISH_SERIAL boot .../boot.img` on the authorized elish. The bootloader accepted the 67,727,360-byte image. Android ADB reappeared about five seconds later, with no captured UEFI, DarwinBoot or XNU output. Full hashes and qualification limits are in reports/elish-ipados-host-image-20261124.md."]
findings = ["The published package workflow uses the pinned elish firmware and applies the device build support patch to the pinned public UniXNU revision. Boot image and boot template host tests passed with that patch applied.", "The host build produced kernel.macho at /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/kernel/kernel.macho (51,122,176 bytes, SHA-256 7ab7c4c90647e17ae1a301117fc3e067616431a17b164a5ef01b0867603605b2). Its kernel.json records instruction_relocation_complete=false, register_dataflow_qualified=false, runtime_qualified=false, abi_qualified=false and loadable=false. These qualifications remain false and the candidate is experimental.", "scripts/package.sh has its executable bit set. The configured sibling core path is provided by /root/repo/UniXNU, a symlink to the current core checkout, so scripts/package.sh works from the device repository.", "The core boot-image builder now honors the device configuration's kernel compression and optional DTB append settings and verifies both choices by round trip.", "The 64 MiB iPadOS payload and 67,727,360-byte Android v3 boot image pass the host unpack-and-compare check. Fastboot accepted the current image, verifying transport format and size. Android reappeared about five seconds later, so iPadOS startup has not been verified.", "The current prelink candidate has 260779 inventoried PC-relative encodings, 69294 pointer bindings and 119 extents, but all relocation, register-dataflow, ABI, runtime and loadability qualification fields remain false. At the pinned core revision the emitters set these fields false by design; report edits do not supply the missing proof.", "Both the target IPSW kernelcache.decompressed and the current kernel.macho candidate are Mach-O MH_EXECUTE. The XnuPrelink file-set emitter requires MH_FILESET input and does not cover this target path. The current ordinary emitter still leaves instruction relocation, register-dataflow, ABI, runtime and loadability qualification false.", "2026-11-24: Run04 image 8ef2e0a78c37171b74d50601703aa94b2f8ec7ed7a1aed00fbb0aebfb2bb33e7 reached EBS without XNU execution. Run05 terminal before-mmu image 14c3bf7d50c7e5fb35151d312efa144bdaf648a557fcaf098c2044193b191b32 was fastboot accepted at 23:25:18 CST but did not re-enumerate within 120 seconds; no partition was written. See reports/elish-loader-fat-initrd-20261124.md", "The run28 Android v3 image was read back to verify its kernel, restore APFS image and trust cache. Bootloader fastboot accepted the image and Apple Restore reached PID 1.",
  "Run35 completed the board preflight, DEBUG FD build and Android boot-image packaging using the run28 payload.",
  "UNIXNU_ELISH_ROOT_IMAGE provides the pinned host userdata image. The build links the digest bundle's SHA-256 into XNU and passes the bundle to DarwinBoot with --root-policies. Run56 passed FAT readback and reached PID 1 from the unchanged SHNGROOT v1 layout.",
  "Local builds and package CI pin UniXNU at e7bddb9a7eecdcf81f36da9fa38bd9d4d3f155c2. The build support patch retains --root-policies alongside the upstream --boot-menu-theme option. The default theme remains selected unless a build opts in to oc-like. The Adreno 740 runtime and kernel ABI updates apply to boards that select that GPU stack.",
]
completion = ["Kernel/prelink and firmware build; payload/ADT are internally consistent; image format and size are accepted by the bootloader in an authorized test."]
limits = ["Run56 proves one exact RAM-only boot image through the full System root and PID 1. The generic prelink qualification and host-generated hardware_tested fields do not record that device result. The new core pin needs a separate firmware build and device boot."]
next_action = ["Use the same verified root payload path when preparing a writable Data seed for the RAM-only Setup candidate."]
evidence = [{ kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "XnuPrelink's 65 host tests passed. Source review confirms relocation, register dataflow, ABI, runtime and loadability remain unqualified.", command = "python3 -m unittest discover -s kits/XnuPrelink -p 'test_*.py'", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "The generated kernel passes DarwinBoot's production Mach-O parser, including LC_UNIXTHREAD entry and the loader-window bounds.", command = "python3 drivers/DarwinBoot/Test/test-kernel-parser.py out/elish/ipados-17.7.11-21H461/elish/kernel/kernel.macho", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "host", reference = "reports/elish-ipados-host-image-20261124.md", result = "The current package command built and verified the 64 MiB payload and 67,727,360-byte Android v3 image. Kernel metadata still has loadable=false and hardware_tested=false.", command = "./scripts/package.sh --no-deps --os ipados-17.7.11-21H461 --uefi /root/repo/uefi-elish", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Elish bootloader accepted the RAM-only image. Android USB enumeration returned about five seconds later without captured UEFI, DarwinBoot or XNU output.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/boot.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }]

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["reports/elish-uefi-console-ramoops-20261124.txt", "reports/elish-uefi-envdxe-dispatch-20261124.txt", "reports/elish-uefi-info-hob-20261124.txt", "reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "scripts/check-elish.py", "scripts/package.sh", "unixnu.lock", "README.md", "PLAN.md", "HANDOFF.md", "reports/elish-offline-audit-20261124.md", "reports/elish-dxe-fv-read-status-20261124.md", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-ipados-host-image-20261124.md", "reports/elish-xnu-entry-probe-20261124.md", "reports/elish-recovery-memory-map-20261124.md", "reports/elish-recovery-proc-iomem-20261124.txt", "reports/elish-recovery-proc-meminfo-20261124.txt", "reports/elish-recovery-cmdline-20261124.txt", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md", "scripts/build-loader-probe.py", "scripts/patch-xnu-ramoops-checkpoint.py", "patches/unixnu-fat-initrd.patch", "patches/darwinboot-fat-initrd.patch", "reports/elish-loader-fat-initrd-20261124.md", "reports/elish-initrd-layout-20261124.txt", "reports/elish-darwinboot-ebs-20261124.txt", "reports/elish-unixnu-reference-audit-20261124.md", "reports/elish-xnu-entry-retest-20261125.md", "reports/elish-xnu-entry-checkpoint-20261125.md", "reports/elish-xnu-entry-checkpoint-run08-20261125.md", "reports/elish-pstore-ufs-live-20261125.md", "reports/elish-xnu-entry-visual-retest-20261125.md", "reports/elish-run09-screen-20261125.jpg", "scripts/patch-xnu-pmsg-checkpoint.py", "scripts/patch-xnu-post-mmu-checkpoint.py", "reports/elish-xnu-vm-return-isolation-20261125.md", "reports/elish-run14-run17-xnu-timing-20261125.md", "reports/elish-progress-20261125-1605.md", "reports/elish-run08-screen-20261125.jpg", "scripts/arm-elish-test-watchdog.py", "scripts/patch-xnu-launchd-checkpoint.py", "reports/elish-restore-root-20261125.md", "reports/elish-run28-launchd-20261125.jpg", "reports/elish-run21-root-panic-20261125.jpg"]
inputs = ["UEFI screen output is captured in four user-provided frames. One RAM-only entry-probe run has indirect USB timing consistent with the post-MMU XNU checkpoint, but no screen recording or serial log was captured. ADB authorization was unavailable after that run. Root Recovery ADB is now available and its Linux memory-map evidence is recorded separately in reports/elish-recovery-memory-map-20261124.md.", "Run09 was flashed to the backed-up active boot_b slot and then restored. The user photo shows the EBS, XNU-entry and pre-MMU bands. Root ADB from the verified LineageOS reader found no pstore files, including no ELISH_XNU_ENTRY_PMSG marker. Commands, hashes and limits are in reports/elish-xnu-entry-visual-retest-20261125.md."]
configuration = ["check-elish.py validates static board inputs and the runtime-managed memory, userdata GPT and UEFI readiness required by the package build."]
procedure = ["Keep build output, image hashes, source revisions and any authorized boot observations with the corresponding porting record entry."]
findings = ["A successful warm reset followed by fastboot continue and root ADB yielded a 21189-byte pstore capture of the pre-BDS memory probe. The HII-order image reached the menu and later returned through USB mass storage with no readable pstore.", "The preflight has a static-only mode for host validation and a strict default mode for build gating.", "The original full image and FDT memory-map probe were accepted by RAM-only fastboot boot and returned to Android without captured UEFI, DarwinBoot or XNU output. The later XNU entry image enabled blue and magenta entry bars and a six-second stage-3 reset after MMU enable. USB returned to Android about 17 seconds after fastboot enumeration, consistent with the configured three-second menu timeout and probe delay. This suggests the post-MMU probe ran, but no screen or serial evidence confirms it. The command, image hash and timing are in reports/elish-xnu-entry-probe-20261124.md.", "Root Recovery ADB now provides a Linux 4.19.325 FDT and /proc/iomem capture for the two DRAM banks. These establish the Recovery kernel's resource view. The UEFI GetMemoryMap descriptors, Qualcomm RAM Partition entries and final ExitBootServices map remain unobserved. See reports/elish-recovery-memory-map-20261124.md.", "A device trace captured two FV HOBs, successful FVB installation, and EFI_ACCESS_DENIED from GetFwVolHeader on both handles. The FDF now sets READ_ENABLED_CAP and READ_STATUS on both firmware volumes. The memory-map probe uses DEBUG_ERROR because DEBUG_INFO is filtered by the elish 0x8007EE0F debug mask.", "The user-provided frames show the Project Silicium elish title, validated 45-region MMU setup, successful PEI HOB construction, DXE Core entry and its Memory Allocation HOB dump. They do not show the custom probe marker or its RAM Partition/GetMemoryMap output. See reports/elish-live-uefi-hob-observation-20261124.md.", "Elish adapted the enuma warm-reset ramoops capture. A RAM-only boot recorded successful PcdDxe dispatch and reached CoreStartImage for EnvDxe; no return marker was captured. See reports/elish-uefi-ramoops-20261124.md.", "The device exported a 14317-byte ramoops log after the Info Blk repair. It confirms RAM Partition protocol installation and a later missing HII String protocol assertion in ConPlatformDxe. The follow-up run with corrected HII ordering reached Android USB mass-storage mode after fastboot continue, with no readable pstore.", "2026-11-24: Recovery after run03/run04 used fastboot boot of the backed-up LineageOS reader, followed by adb root/pstore export. Do not use fastboot continue, which led to mass storage or shutdown. Wait for actual enumeration, allowing 120 seconds; the loader probe timeout itself is 20 seconds. Run05 probing stopped after that deadline; the user was asked to reboot directly into root ADB. See reports/elish-loader-fat-initrd-20261124.md", "2026-11-25: The user photo shows DarwinBoot's green handoff band, 256 MiB window and entry-register output; EBS is confirmed, but no blue/magenta entry band or XNU checkpoint is visible. The source image identity is unknown. A six-second entry-reset image was accepted by fastboot and Android ADB returned as lineage_elish; root ADB found an empty pstore, with the user's visual observation of colored bars still pending. See reports/elish-xnu-entry-retest-20261125.md.", "2026-11-25 run07: fastboot accepted the 67,751,936-byte entry-checkpoint image (SHA-256 38b548e03d2a0156f443e010cfdecca2becd7bc745f911a56dbb99e1b99c1e37). The terminal XNU patch appends its ramoops marker only when SCTLR_EL1.M=0 and ring metadata is valid; without a recovered pstore the marker and XNU entry are unconfirmed. USB disconnect/re-enumeration is inconclusive. The user currently reports fastboot, while the latest host snapshot enumerated no tablet. See reports/elish-xnu-entry-checkpoint-20261125.md.", "Offline audit compared Linux v4.19 persistent_ram_buffer and the elish RamLogWrite implementation. A marker can be appended only while the ring is unwrapped with enough contiguous space. The run07 writer missed the exact-capacity wrap of start; scripts/patch-xnu-ramoops-checkpoint.py now wraps it. A temporary kernel copy assembled to 276 bytes (SHA-256 0ad2ca17724f66adf25afd473008e9c47842c2b00d55d8b1ec79ba6c40b9086f); run08 was then built offline with the corrected writer: the 64 MiB payload SHA-256 is ab5b2b00fc2fa592bf71434e01c93fd793ff48d6c13aa763a45ecdaae297ac1d and the 67,751,936-byte boot image SHA-256 is 9cd0577439a5f143ff11d81cdaa6aece79da01a25cfd5cfdf67ddea0a7a5075a. It was later RAM-booted; root ADB recovered no pstore files and reported an invalid deflate size, so the checkpoint remains unconfirmed. See reports/elish-xnu-entry-checkpoint-run08-20261125.md.", "2026-11-25 run09: the close photo directly shows DarwinBoot green EBS, XNU stage-1 blue and stage-2 magenta pre-MMU bands, confirming XNU execution through the pre-MMU checkpoint. The image includes a six-second post-MMU PSCI reset, but fastboot return does not independently prove that stage. The configured pmsg marker was absent from the empty pstore. The original boot_b backup was restored and the reader returned root LineageOS ADB. See reports/elish-xnu-entry-visual-retest-20261125.md.", "2026-11-25 run18: built a separate post-VM marker kernel and DEBUG-only pmsg readback image. The kernel writes magic/complement at 0xb03ff000 only after `_arm_vm_init` returns; the UEFI probe reads it before its EBS stop. Both images are host-built and untested on elish; the current direct stage remains pre-MMU. See reports/elish-run18-post-vm-pmsg-20261125.md.", "The after-mmu ramoops checkpoint assembled on a copy of the 21H461 build. Run28 used the separate launchd checkpoint and recorded the cyan band both on the host camera and in the user close-up.",
  "Run34 was accepted by fastboot and then disappeared from USB. The verified reader never reached download and no kernel log was recovered. Its built-in Android drivers could modify SMMU and UFS state before PID 1, so the image is retired. Run35 uses the passive UEFI path.",
  "Run51 returned to bootloader fastboot about 20 seconds after boot. The camera recorded the BSD root authentication panic and Recovery pstore was empty.",
  "Run52's verified Lineage reader was recovered from boot_b by a read-only ADB export and matched the historical SHA-256. Its RAM-only boot yielded unauthorized ADB and no ramoops capture.",
  "Run56 used bootloader fastboot and a camera. The recorded PID 1 checkpoint confirms both verified APFS mounts and Apple launchd main. The tablet warm-restarted to bootloader fastboot.",
]
completion = ["Every claimed milestone has a reproducible command, matching source/image revision and accessible result."]
limits = ["Run56 confirms the full System-root PID 1 checkpoint. Setup and persistent Data are untested. Production prelink qualification flags remain false."]
next_action = ["Capture the Setup Assistant checkpoint with a writable volatile Data seed and the terminal PID 1 checkpoint disabled."]
evidence = [{ kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "scripts/check-elish.py --static-only passed. Runtime memory ownership remains unverified.", command = "python3 scripts/check-elish.py --static-only", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "host", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Built the routine FD with the FVB read-status fix and a separate diagnostic memory-map DXE. The diagnostic image contains no iPadOS payload.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot accepted the iPadOS image and the FDT memory-map probe. Android USB returned after each boot. The probe FDT property could not be read after ADB authorization was lost.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-memory-map-fdt-probe.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted the 67,727,360-byte RAM-only entry-probe image. Android USB returned about 17 seconds after fastboot enumeration, consistent with the configured menu timeout and six-second post-MMU reset. This is indirect evidence only because no screen or serial output was captured. ADB returned unauthorized. No partition was written.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-entry-reset.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot getvar confirmed product elish. Fastboot accepted the current 67,727,360-byte image, then ADB identified stock Android 13 V816.0.2.0.TKYCNXM. No UEFI/DarwinBoot/XNU logs were captured, and Android shell could not read pstore.", command = "fastboot -s ELISH_SERIAL getvar product && fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/boot.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted elish-xnu-arm-vm-return.img and Android USB returned. Host USB logs show a disconnect at 20:09:13 and Android enumeration at 20:09:26. This timing is indirect and does not confirm the _arm_vm_init return marker.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-arm-vm-return.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }, { kind = "device", reference = "reports/elish-xnu-entry-retest-20261125.md", result = "Fastboot product was elish and accepted the six-second entry-reset image; ADB returned as lineage_elish. Root pstore was empty. No visual confirmation of XNU entry or MMU enable is recorded.", command = "fastboot -s 4bed07e4 getvar product && fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-entry-reset.img && adb -s 4bed07e4 root && adb -s 4bed07e4 shell ls -l /sys/fs/pstore", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "device", reference = "reports/elish-xnu-entry-checkpoint-run08-20261125.md", result = "Fastboot 37.0.3 verified product=elish and accepted the corrected run08 image RAM-only. The user photo shows the green ExitBootServices handoff. Root ADB found an empty pstore and Invalid compression size for deflate: 0; no XNU entry marker was recovered, so entry remains unconfirmed.", command = "fastboot -s 4bed07e4 getvar product && fastboot -s 4bed07e4 boot run08-xnu-entry-checkpoint-corrected/boot.img && fastboot -s 4bed07e4 boot backups/lineage-reader-boot.img && adb -s 4bed07e4 root && adb -s 4bed07e4 shell ls -la /sys/fs/pstore", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905" }, {kind = "device", reference = "reports/elish-xnu-entry-visual-retest-20261125.md", result = "Fastboot 37.0.3 verified product=elish and flashed run09 to active boot_b successfully. The user photo directly shows the green EBS, blue XNU-entry and magenta pre-MMU bands. The pmsg marker was not recovered from root reader ADB; original boot_b was restored successfully.", command = "fastboot -s 4bed07e4 flash boot_b run09/boot.img; fastboot reboot; fastboot -s 4bed07e4 flash boot_b backups/boot_b.img; fastboot -s 4bed07e4 boot backups/lineage-reader-boot.img; adb -s 4bed07e4 root; adb -s 4bed07e4 shell ls -la /sys/fs/pstore", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}, {kind = "device", reference = "reports/elish-restore-root-20261125.md", result = "Run28 RAM-booted the 21H461 restore APFS root through RamBlock. The recording shows the cyan marker painted only after PID 1 successfully writes kern.initproc_spawned=1. Apple launchd reached main. The full System root and persistent Data remain unverified.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run28-restore-launchd-cyan/boot.img", revision = "24de4f60e84762378ce9b1e906b86827b1b2121c"}]
