schema_version = 1

[device]
name = "elish"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro Wi-Fi (M2105K81AC). Host XNU, elish UEFI, userdata-root, 64 MiB iPadOS payload and Android v3 boot image are built and recorded. Screenshots confirm elish Silicium DXE HOB allocations. A RAM-only XNU entry probe has indirect timing evidence consistent with reaching the post-MMU stage. The kernel remains loadable=false, and final UEFI/XNU memory ownership and iPadOS startup remain unverified."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["AGENTS.md", "README.md", "board.toml", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "local.toml.example", "package/unixnu.toml", ".github/workflows/porting-record.yml"]
inputs = ["Read-only Android identity: M2105K81AC/elish, SM8250-AC soc_id 356 revision 2.1, CPUs 0-7, display 1600x2560; Linux MemTotal is 7775836 kB and is not a DRAM map.", "UniXNU profile ipados-17.7.11-21H461 selects iPad7,1/J120AP."]
configuration = ["board.toml identifies Wi-Fi elish and the target OS profile; feeds.toml and unixnu.lock contain matching pins for all nine declared Git sources.", "Stage 1 selects only ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; memory and UEFI readiness remain gated. The measured userdata geometry is recorded in [userdata].", "The complete kernel archive array retains the inherited build-mockfs-fixture.py after SoftwareAES bindings.", "package/LinkStubs.c defines the optional arm64_platform_sleep_hook as null so static kernel linkers can resolve ArmCpu's weak import; platform sleep remains disabled by default.", "[package] unixnu points to the sibling UniXNU checkout, matching the package wrapper's relative-path contract."]
procedure = ["Ran elish_defconfig, status --json, record validation, static preflight, tree assembly and release --check --no-deps; the patch plan contains 62 entries.", "On the current Linux host, scripts/check-elish.py --static-only passed and dtc -I dts -O dtb compiled the board DTS to /tmp/elish-check.dtb (SHA-256 34e4b5d32942f829d1e44211cc7939b0265d25ff41dd4019f820939ee81d3293).", "Ran ./scripts/package.sh --check --os ipados-17.7.11-21H461; dependencies, target IPSW inputs, defconfig, and all 62 patches resolved. The fetch normalized the generated unixnu.lock header without changing pinned commits."]
findings = ["The Wi-Fi elish target is distinct from 5G enuma. The sibling Format 2 draft had copied enuma's userdata geometry and an unverified DRAM size; those values are no longer used.", "The format2-device branch has an independent history in the core repository; CI uses the previous commit on that branch instead of comparing it with the unrelated core main branch.", "The package wrapper's ../UniXNU-elish default resolved back to this device checkout; it now names the core repository directory, ../UniXNU.", "A kernel build exposed that replacing inherited archive arrays also omitted build-mockfs-fixture.py; the XNU link required its generated archive because CONFIG_XNU_SOURCE_MOCKFS is enabled.", "The Linux cctools ld64 final-link test rejected the ArmCpu weak import when unresolved; the device link-stub archive now provides a null pointer definition, leaving platform sleep off unless explicitly enabled."]
completion = ["The selected components and patch order appear in status; all declared source commits match unixnu.lock; board, README and porting record identify the same target."]
limits = ["The experimental kernel remains loadable=false. UEFI/XNU runtime ownership and storage-controller/root-volume behavior remain unverified despite the successful host payload and boot-image build."]
next_action = ["Continue kernel loadability and SM8250 UFS qualification. Review the captured DXE HOB ranges against the runtime-managed DarwinBoot/XNU handoff before device testing."]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "proprietary-files.txt", "board.toml", "dts/**", "package/**", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-memory-map-probe-20261124.md", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md"]
inputs = ["The stock ROM directory /root/repo/elish_os1.0.2.0 contains 28 image files (about 8.2 GB). vendor.img is ext4 and its build.prop confirms Xiaomi/elish, M2105K81AC, Android 13 V816.0.2.0.TKYCNXM. Relevant image and installed-slot hashes are recorded in HANDOFF.md and the UEFI porting record.", "The supplied xbl.img SHA-256 is 9a3a3bb92e6cf478b227f70dd1bd140fde32982994a6c34a07bd314ea0acb72f. Its embedded uefiplat.cfg records the UEFI FD, stack, DXE heap and display reservation. The selected PlatConfigFileName is uefiplatLA.cfg, whose contents and lookup source remain unresolved. Details are in the UEFI Platforms/Xiaomi/elishPkg/PORTING.md and reports/elish-xbl-config-lookup-20261124.md.", "The XBL firmware volume contains candidate SimpleTextInOutSerial, DisplayDxe and UFSDxe modules. The extracted elish UFSDxe PE32 SHA-256 is ffeaed467f8251b7e30a45075da84a1c563e2bac7dc4be0f79f0ed49a88b8dc9 and matches alioth and pipa catalog copies. DisplayDxe SHA-256 is 6c6351c3c770d4f698e5e22097021fe8d20d35a8d4181df05676a48c4347f425. No candidate has been copied into the elish FD.", "The stock XBL EnvDxe PE32 hash 62e81b81dc507a5ecd2e9e2d732c3e642c7c107bcdd51a236bbc029800b645ed and SmemDxe PE32 hash 4ad21b61ab64d1d91403403c8ce23b60648a2fb29c781fe4a7cb5a3996d727aa match alioth and pipa catalog binaries. EnvDxe contains the RAM Partition protocol path. Android does not export the SMEM table or UEFI memory map through the available read-only interfaces.", "The elish UEFI checkout uses Mu-Silicium revision 66421cb7bb5694843aec8de1ca3d1de4c20cca38 and Mu_Basecore revision cfb93724a06ff86ff5ba971413368a7809ee42a5. Its embedded memory map is static configuration evidence. Live FDT and RAM Partition entries agree on two DRAM banks. The final UEFI GetMemoryMap remains unverified.", "Catalog UFSDxe DEPEX protocol GUIDs were statically traced to SmemDxe and SPMIDxe InstallMultipleProtocolInterfaces calls. The elish stock SmemDxe matches the catalog hash. The elish stock SPMI PE32 hash matches the catalog. Stock NpaDxe also matches and installs UFSDxe protocol GUID 79d6c870-725e-489e-a0a1-27e7a5d0cb35. XBL uefiplat.cfg sets EnableUfsIOC=0 and UfsSmmuConfigForOtherBootDev=1, matching elish ConfigurationMapLib. Runtime storage initialization remains unresolved. Full module comparison is in reports/elish-offline-audit-20261124.md."]
configuration = ["board.toml selects Platforms/Xiaomi/elishPkg/elish.dsc and Resources/Configs/elish.toml. The DSC/FDF include the elish memory/configuration maps, EnvDxe, SmemDxe, RamManagerDxe, optional ElishMemoryMapProbeDxe, UniXNU, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and FAT support.", "The current board sets ELISH_MEMORY_MAP_PROBE=FALSE and enables DEBUG-only ELISH_RAMOOPS_LOG. The elish FDF enables READ_ENABLED_CAP and READ_STATUS on both firmware volumes so the DXE FVB can read them.", "The diagnostic probe is a DXE driver in the FV APRIORI list. It prints through UefiLib and holds for 120 seconds after its display routine returns. Device execution of the probe remains unverified."]
procedure = ["Parsed the XBL firmware volume read-only and recorded the UEFI FD, stack, DXE heap and display reservation in the elish UEFI package notes. Compared the XBL display reservation with the live FDT and identified a 1 MiB size difference.", "Read the active slot, XBL partition hashes and ROM-length prefixes over root ADB. The active slot is _b, both slot pairs match, and the installed XBL/XBL config prefixes match the supplied ROM files byte-for-byte.", "Searched XBL FV PE32 sections for the RAM Partition protocol GUID. EnvDxe is the only match. Its PE32 hash matches catalog copies and its strings identify the SMEM memory-partition-table path. Android exports no debugfs or /dev/mem interface for reading that table.", "Initialized pinned Mu_Basecore submodules and ran `make -C BaseTools/Source/C -j8`, then built the elish FD with `./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8`. The 3 MiB FD build succeeded. Details are recorded in reports/elish-uefi-build-20261124.md.", "Built a firmware-only Android v3 probe image with `./unixnu bootimg`; its pack/unpack verification passed. It has an empty ramdisk and is not an iPadOS image. Added and compiled the optional ElishMemoryMapProbeDxe, then built a separate diagnostic image that prints the RAM Partition protocol and pre-application UEFI memory map to the framebuffer. Initial callback-based images were accepted by fastboot but produced no captured output.", "Installed hash-verified Ghidra 12.2 and Temurin JDK 25 outside the repositories, then analyzed xbl.img read-only with analyzeHeadless. The function and configuration findings are recorded in reports/elish-xbl-config-lookup-20261124.md.", "A screen capture showed two FV HOBs and successful FVB installation, followed by EFI_ACCESS_DENIED from GetFwVolHeader on both handles. FwVolBlockReadBlock returns this status when EFI_FVB2_READ_STATUS is clear. Added READ_ENABLED_CAP=TRUE and READ_STATUS=TRUE to both FV sections, rebuilt the 3 MiB FD, and verified attributes 0x000C0C06 and 0x00030C06. The corrected firmware-only Android v3 image was accepted by fastboot boot. The user reported reaching the installed system, and adb devices identified lineage_elish. No partition write was run.", "Built separate 600-second probe images with synchronous DXE entry, APRIORI ordering and direct console output. The user later supplied four frames showing the Silicium title, 45-region MMU validation, successful platform HOB construction, DXE Core entry and memory-allocation HOB rows. The screenshots do not show the custom probe marker or its RAM Partition and GetMemoryMap output. The HOB rows and public pipa cross-check are transcribed in reports/elish-live-uefi-hob-observation-20261124.md."]
findings = ["The HII-order RAM-only image reached the UniXNU menu as observed on the tablet. FAT configuration discovery and DarwinBoot handoff remain to be confirmed.", "The supplied stock image directory has no GPT/rawprogram layout file. The only raw-byte occurrence of uefiplatLA.cfg is the XBL reference; the vendor /firmware directory listing has no same-named file. No proprietary image has been copied into this repository.", "The XBL configuration display reservation is 0x9c000000+0x02400000. The live FDT reports 0x9c000000+0x02300000. The embedded PIL range is 0x86000000+0x0d200000, while the live FDT lists PIL and secure ranges from 0x86200000 through 0x92700000. The DBI Dump 0x9e400000+0x00f00000 is tagged NoHob/MMAP_IO, while Linux /proc/iomem reports it as System RAM. The selected uefiplatLA.cfg and active UEFI map remain unresolved.", "EnvDxe is the only XBL FV PE32 containing the RAM Partition protocol GUID and matches the alioth/pipa catalog binary. The built FD includes EnvDxe, SmemDxe and RamManagerDxe. The returned RAM ranges and final UEFI GetMemoryMap still need live capture.", "The diagnostic FD is 3,145,728 bytes with SHA-256 8f797816d1b3ac59338c248a7ed17442d4f3878e5abc2fae80314811d6967548. The earlier 618,496-byte firmware-only image remains available with SHA-256 8b08c449b4af3a4ab13c07389a789c170a83d6c373b68dfe76dc959224fef349. The second DRAM bank endpoint was corrected to 0x280000000 from the live FDT, superseding earlier diagnostic-build hashes. The instrumented 622,592-byte Android v3 image has SHA-256 b2ccb5968d7cb30a462bf0f1c6deca84167ccb10c7f7a36782e07559c0fbf6d6. Both images have empty ramdisks. The instrumented image was accepted by fastboot, then the target disappeared from USB enumeration; no screen output was captured and no partition-write command was run. A rebuilt 120-second diagnostic image is 622592 bytes with SHA-256 f312ddfa2adacd2a48ef3d09e313765b668b1affe7e710426b3e3411fcd1e650 and has not yet been booted.", "After the diagnostic image produced no captured framebuffer output, the user directed that device detection attempts stop while offline work continues. The routine board firmware define now excludes ElishMemoryMapProbeDxe.", "Headless XBL analysis found FUN_9fc107e0 requesting uefiplat.cfg through FUN_9fc12890 and parsing Config, MemoryMap, RegisterMap, ConfigParameters and ChipIDConfig. FUN_9fc10e14 stores ConfigParameters as key/value pairs. The embedded values name uefiplatLA.cfg and OsTypeString LA, while the consumer and source of that file remain unresolved.", "The first firmware trace identified missing READ_STATUS bits in both generated FV headers as the cause of the DXE dispatcher failure. The permanent FDF correction is retained, and temporary Mu_Basecore trace instrumentation has been removed. See reports/elish-dxe-fv-read-status-20261124.md.", "A fixed-FV RAM-only boot returned the device to its installed lineage_elish system. The first memory-map probe used DEBUG_INFO, which is filtered by the configured 0x8007EE0F debug mask. The rebuilt DEBUG_ERROR probe output has not yet been observed.", "The user-provided screen frames identify Project Silicium for Xiaomi Xiaomi Pad 5 Pro Wi-Fi. They show MMU: 45 regions and map valid, SEC memory HOB completion, successful platform HOB construction, HOB list counts of 94 and 98, FV decompression, and DXE Core at 0x9b4c7000. The DXE Core HOB walk prints live allocation records including the 0x98900000-0x9bbfffff conventional DXE heap, the 0x9fc00000-0x9fefffff firmware volume, and the reserved 0xa0000000-0xafffffff kernel window. Full transcription, source correlation, image hashes and the public pipa map reference are in reports/elish-live-uefi-hob-observation-20261124.md.", "Two newly built 634,880-byte firmware-only Android v3 probes were accepted by fastboot while product was elish. The latest image, SHA-256 03b08a9f39c09038d2c4f57c5b0df0fbb754f6e23964d7a9c40507e2b5027cd0, has a 120-second hold after the probe display routine returns; Android ADB re-enumerated within 10 seconds. This does not establish whether the DXE driver ran or the platform Stall call advanced. The previously booted FDT probe property was absent from Android /chosen. No UEFI descriptors were captured and no partition was written. See reports/elish-memory-map-probe-20261124.md.", "Elish adapted the enuma warm-reset ramoops capture. A RAM-only boot recorded successful PcdDxe dispatch and reached CoreStartImage for EnvDxe; no return marker was captured. See reports/elish-uefi-ramoops-20261124.md.", "Enabling PcdBuildXblHobs restored the Info Blk HOB. On elish, EnvDxe then installed the RAM Partition protocol and dispatch advanced to the ConPlatformDxe HII assertion. HiiDatabaseDxe now precedes ConPlatformDxe in APRIORI. The HII-order image returned to fastboot after a RAM-only boot; USB storage enumeration after continue prevented log extraction."]
completion = ["The firmware enters UniXNU, publishes a validated framebuffer, exposes the initrd volume and preserves a measured memory map."]
limits = ["The screenshots confirm the Silicium PEI memory-map validation and DXE HOB allocation dump. The custom probe callback, Qualcomm RAM Partition entries, complete UEFI GetMemoryMap descriptor array, final ExitBootServices map, framebuffer handoff and XNU ownership remain unverified. The full iPadOS image and XNU entry diagnostic image were accepted by RAM-only fastboot boot, but no complete iPadOS boot is confirmed. A stable local software identity seed is stored in the ignored core config.", "The photographed allocation HOBs do not include the full physical resource map or the second-bank RAM Partition ranges. The DEBUG_ERROR probe remains available for a later attended run."]
next_action = ["Capture the selected DarwinBoot memory window and the final ExitBootServices map, then verify the XNU entry with a direct checkpoint."]
evidence = [{ kind = "source", reference = "reports/elish-uefi-build-20261124.md", result = "The instrumented elish FD and 622,592-byte firmware-only Android v3 probe build successfully. A prior fastboot boot was accepted, then the target disappeared from USB enumeration. No framebuffer output was captured, so callback execution and reported memory remain unverified. Per the user's direction, device detection and diagnostic boot attempts are suspended while host work continues. Full build and historical result are in reports/elish-uefi-build-20261124.md." }, { kind = "host", reference = "reports/elish-uefi-build-20261124.md", result = "Rebuilt the 3 MiB routine FD with ELISH_MEMORY_MAP_PROBE=FALSE. FVMAIN.Fv.txt, FVMAIN.Fv.map and FVMAIN.inf contain no ElishMemoryMapProbeDxe entry. SHA-256 is 5c1cc81f58df5e255ea2e87e29169ae17e3f8aecbce464feb9ff16df13ba0b3e. No device operation was run.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "host", reference = "reports/elish-xbl-config-lookup-20261124.md", result = "Ghidra analyzed the supplied XBL as AArch64 ELF and identified the uefiplat.cfg lookup and ConfigParameters handler. It did not locate the uefiplatLA.cfg consumer or file source.", command = "analyzeHeadless /tmp/elish-ghidra-projects ElishXbl -import /root/repo/elish_os1.0.2.0/xbl.img -postScript FindElishCfgReferences.java", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "host", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Built a routine 3 MiB FD with both FV read-status bits set and a separate 622,592-byte visible-output memory-map probe image. The probe PE32 contains the expected DEBUG_ERROR output strings. The routine board setting remains ELISH_MEMORY_MAP_PROBE=FALSE.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Fastboot accepted the corrected RAM-only image. The user reported reaching the installed system, and ADB enumeration identified lineage_elish on M2105K81AC. No partition-write command was run.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/elish-dxe-fv-readable.img", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, {kind = "device",reference = "reports/elish-live-uefi-hob-observation-20261124.md",result = "Four user-provided screen frames show the elish Silicium title, successful 45-region MMU validation, HOB construction, DXE Core entry and runtime memory-allocation HOB rows. Source code and public pipa configuration cross-check the legible ranges. The custom probe marker, RAM Partition entries and full UEFI GetMemoryMap are absent.", command = "sha256sum /root/repo/IMG_3176(20261124-144243).PNG /root/repo/IMG_3177(20261124-144250).PNG /root/repo/IMG_3182(20261124-145145).PNG /root/repo/IMG_3183(20261124-145203).PNG", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38"},
  { kind = "device", reference = "reports/elish-uefi-ramoops-20261124.md", result = "Warm reset and Android pstore export preserved the pre-return EnvDxe dispatch marker, with a successful PcdDxe dispatch earlier in the same log.", command = "fastboot boot boot.img && fastboot continue; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" },
  { kind = "device", reference = "reports/elish-uefi-info-hob-20261124.md", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38", command = "fastboot boot boot.img && fastboot continue; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Restoring Info Blk allowed EnvDxe to register RAM Partition and DXE to reach ConPlatformDxe, which asserted on missing HII String protocol." },
]
[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/**", "configs/elish_defconfig"]
inputs = ["Android reports CPUs 0-7 present. CPU topology, GICv3 and timer details come from the pinned SM8250 SoC source, not an elish XNU boot."]
configuration = ["ArmCpu is selected in stage 1; CPU nodes and interrupt handling are supplied by the SoC package."]
procedure = ["Build and boot only after memory and firmware inputs are verified; check each CPU entry and timer/IPI behavior separately."]
findings = ["Android reports the expected CPU count. The stage-1 DTS inherits the SM8250 CPU topology. XNU core bring-up is pending."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["No XNU boot or per-core execution has been observed on elish."]
next_action = ["Verify SoC source resolution, then test CPU bring-up during an authorized RAM-only boot."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "dts/elish.dts", "board.toml", "scripts/check-elish.py", "patches/xnu/elish-memory-excluded-ranges.patch", "reports/elish-offline-audit-20261124.md", "reports/elish-memory-handoff-xnu-backport-20261124.md", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-xnu-entry-probe-20261124.md", "reports/elish-recovery-memory-map-20261124.md", "reports/elish-recovery-proc-iomem-20261124.txt", "reports/elish-recovery-proc-meminfo-20261124.txt", "reports/elish-recovery-cmdline-20261124.txt", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md"]
inputs = ["Root ADB exported /sys/firmware/fdt (845892 bytes, SHA-256 90cf1d5333e758f001a8e21ed4e78fc000ebf3b5502338f010435a2da292a663). Its live memory node reports 0x80000000+0x3bb00000 and 0xc0000000+0x1c0000000. The FDT has 22 fixed and 12 dynamic reserved-memory children; the full list and /proc/iomem capture are in reports/elish-live-hardware-20261123.md. A follow-up root ADB check found no /sys/firmware/memmap, /sys/kernel/debug or /dev/mem interface, and no RAM Partition table information in pstore or dmesg. The live /soc/qcom,smem node is bound to qcom-smem and references no-map smem_region@80900000 at 0x80900000+0x200000, but exports no SMEM nvmem device or /dev node.", "Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, ran as root on Linux 4.19.325-cip136-st20-perf-g6b34d2476532. Its FDT reports the same two DRAM banks; the raw FDT, /proc/iomem, /proc/meminfo and cmdline, hashes, and interpretation are recorded in reports/elish-recovery-memory-map-20261124.md.", "Core revision 71c5c6569bae6369c0e0f634df8b9bd5afc19139 requires one contiguous hardware memory range in scripts/unixnu/devicetree.py. The upstream iPadOS profile has no excluded-range consumer. Device patch elish-memory-excluded-ranges.patch adds that consumer to XNU 10063.141.1, and board.toml requests 16 excluded-range slots. The RAM Partition table and pre-BDS UEFI map have been captured. The final handoff map remains unobserved."]
configuration = ["dts/elish.dts declares both root-ADB-measured DRAM banks. board.toml uses memory_map=runtime-managed and payload.dram_size=0x200000000. DarwinBoot obtains usable runs from the current UEFI map and the ADT reserves a 256 MiB owned window with 16 excluded-range slots for the target XNU consumer.", "The device XNU patch consumes /chosen/darwinboot-memory-excluded. The 64 MiB payload and Android v3 image now build on the host. Runtime descriptor values and the actual DarwinBoot allocation still require device confirmation."]
procedure = ["Read /sys/firmware/fdt and /proc/iomem over root ADB, decoded both DRAM tuples and all reserved-memory children, and configured the measured banks in the DTS. The supplied firmware screenshots were then checked against the DXE Core HOB printer and the elish XBL-derived map. The full UEFI map and DarwinBoot allocation remain to be observed.", "Booted Recovery and read /sys/firmware/fdt, /proc/iomem, /proc/meminfo and /proc/cmdline through root ADB. Saved the raw captures and hashes in reports/elish-recovery-memory-map-20261124.md.", "Audited the pinned DarwinBoot AllocateWindow/AllocateSpan branches and the target XNU arm_vm_init consumer. Ran the DarwinBoot memory-window, ADT-window and loader-input host tests against their synthetic-map models.", "Added the XNU excluded-range consumer in the device patch series and built the full target kernel. Ran the normal device package check, production DarwinBoot Mach-O parser, and all 65 XnuPrelink tests."]
findings = ["The ramoops probe recorded both Qualcomm RAM Partition banks and 47 pre-BDS UEFI DRAM descriptors. Both banks match the live Linux FDT. The final DarwinBoot map and selected XNU window remain unverified.", "The measured DRAM banks total 0x1fbb00000 bytes and are separated by a 0x4500000-byte gap. The DTS exposes both measured banks. The Recovery FDT independently reports the same tuples. Its /proc/iomem records Linux System RAM resource extents with nested reserved and kernel code/data ranges. This confirms the Linux Recovery view, not firmware ownership. The shared ADT generator describes a contiguous hardware envelope, while DarwinBoot uses the runtime UEFI map to select usable pages and reports firmware-owned exclusions to XNU. A spanning envelope includes the gap, so the hardware range and loader-managed window remain distinct.", "The upstream iPadOS profile has no consumer for darwinboot-memory-excluded. The device patch adds a target-XNU parser that validates, clips, page-aligns, sorts and merges ranges, protects the kernel early allocation region, excludes pages from pmap/VM accounting, and leaves those physmap ranges unmapped. The board requests the excluded-range table with 16 slots.", "The supplied frames show the runtime DXE Core memory-allocation HOB dump. Readable ranges include the conventional DXE heap 0x98900000-0x9bbfffff and reserved kernel window 0xa0000000-0xafffffff, matching named rows in the elish XBL-derived map and public pipa configuration. HOB allocation records do not expose the full GetMemoryMap or Qualcomm RAM Partition table. The HOB evidence and exact transcription are in reports/elish-live-uefi-hob-observation-20261124.md.", "A RAM-only image with the UniXNU entry bars and six-second post-MMU reset returned to Android about 17 seconds after fastboot enumeration, consistent with the menu timeout, XNU probe delay and Android return. No display or serial output was captured, so this is indirect evidence of reaching the post-MMU XNU stage. See reports/elish-xnu-entry-probe-20261124.md.", "The ramoops dispatch trace reaches the driver start call for EnvDxe, the candidate RAM Partition protocol provider. Its return status, RAM Partition table, and UEFI descriptors remain unobserved.", "EnvDxe installed the Qualcomm RAM Partition protocol on elish after the Info Blk HOB was restored. The host-built DEBUG map probe writes the protocol entries and pre-BDS UEFI descriptors to ramoops. The diagnostic image captured the pre-BDS map on elish. The ExitBootServices map remains unobserved."]
completion = ["All handoff regions are accounted for and each enabled DMA engine uses a documented, verified allocation and cache policy."]
limits = ["The physical DRAM tuples and Linux reservations are measured, and the screenshots confirm named firmware allocation HOBs in the first bank. The final UEFI GetMemoryMap, dynamic secure/display ownership, the 1 MiB display-reservation discrepancy, and the usable DarwinBoot/XNU physical window remain unresolved. Timing from one RAM-only probe is consistent with XNU reaching its post-MMU checkpoint, but there is no screen or serial confirmation. The XNU candidate remains loadable=false."]
next_action = ["Capture the selected DarwinBoot memory window and the final ExitBootServices map, then verify the XNU entry with a direct checkpoint."]
evidence = [{ kind = "host", reference = "reports/elish-memory-handoff-xnu-backport-20261124.md", result = "The device series applies 63 patches. Target XNU and XnuPrelink build successfully, and the production DarwinBoot Mach-O parser accepts the 51,122,176-byte candidate. The board requests 16 excluded-range slots. XnuPrelink qualification remains false, and runtime memory ownership remains unverified.", command = "./unixnu build kernel -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 -j 8", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, {kind = "device",reference = "reports/elish-live-uefi-hob-observation-20261124.md",result = "The user-provided screenshots show the validated 45-region PEI table, successful HOB construction, DXE Core entry and named live allocation HOBs. They confirm the first-bank firmware allocation regions but do not include the full UEFI memory map, RAM Partition ranges or the DarwinBoot allocation.", command = "sha256sum /root/repo/IMG_3176(20261124-144243).PNG /root/repo/IMG_3177(20261124-144250).PNG /root/repo/IMG_3182(20261124-145145).PNG /root/repo/IMG_3183(20261124-145203).PNG", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, {kind = "device", reference = "reports/elish-recovery-memory-map-20261124.md", result = "Root Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, captured the Linux 4.19.325 FDT, /proc/iomem, /proc/meminfo and cmdline. The two FDT DRAM tuples match the configured banks. This establishes Linux-visible memory resources only; UEFI descriptors and RAM Partition entries remain unobserved.", command = "adb -s ELISH_SERIAL shell 'id; uname -a; cat /proc/cmdline; cat /proc/meminfo; cat /proc/iomem' && adb -s ELISH_SERIAL pull /sys/firmware/fdt reports/elish-recovery-fdt-20261124.dtb", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["board.toml", "dts/elish.dts", "configs/**", "package/**", "reports/elish-userdata-build-20261124.md", "reports/elish-stock-storage-audit-20261124.md", "reports/elish-offline-audit-20261124.md"]
inputs = ["Read-only root ADB identifies UFS route 1d84000.ufshc and `/dev/block/sda` capacity 253461790720 bytes, with 4096-byte logical blocks and 61880320 LBAs. GPT partition 34 `userdata` spans inclusive LBAs 6619136–61870314, or 226308829184 bytes. Primary and backup GPT headers and arrays pass CRC checks, and both arrays are byte-identical. Export hashes and the read commands are recorded in reports/elish-live-hardware-20261123.md.", "The active Android kernel binds `1d84000.ufshc` (`qcom,ufshc`) to `ufshcd-qcom` and `1d87000.ufsphy_mem` (`qcom,ufs-phy-qmp-v4`) to `ufs_qcom_phy_qmp_v4`. Live FDT exposes controller `reg=<0x1d84000 0x3000 0x1d90000 0x8000>`, interrupt specifier `<0 0x109 4>`, a two-lane PHY at `0x1d87000`, and core, bus, interface, UniPro, ICE, reference and lane-sync clocks. The host node has no `iommus` property or `iommu_groups` link. This records the Android binding and FDT only; UEFI/DarwinBoot DMA ownership and SMMU stream IDs remain unverified. Details are in reports/elish-live-hardware-20261123.md.", "Offline extraction of stock vendor_boot v3 plus DTBO entry 12 (elish board ID 47) confirms UFS `0x1d84000+0x3000`, ICE `0x1d90000+0x8000`, QMP v4 PHY `0x1d87000+0xe00`, SPI 265, two lanes, nine clock names and core reset. The stock UFS node has no `iommus` property. Input hashes, extracted FDT hashes and commands are recorded in reports/elish-stock-storage-audit-20261124.md.", "The supplied ROM image directory contains no GPT/rawprogram layout file. fastboot getvar did not respond, so geometry was obtained from the running device's block device.", "Stock vendor_boot v3 and DTBO entry 12 identify the elish UFS/PHY/ICE windows, SPI 265, clock names and reset. The stock UFS node has no iommus property. Details and hashes are in reports/elish-stock-storage-audit-20261124.md.", "The pinned UniXNU-sm8250-common SoC package names Linux v6.6 revision 5b0764a53235d3c77e1ed674e836e1b3fe1a4b1f as its register source. Its gcc-sm8250.c and qcom,gcc-sm8250.h define a separate SoC baseline; SHA-256 values and the stock clock/reset specifier comparison are recorded in reports/elish-offline-audit-20261124.md."]
configuration = ["Stage 1 does not enable UFS/PHY. board.toml [userdata] now records first_lba=6619136, last_lba=61870314 and lba_bytes=4096 with userdata_geometry=verified.", "The future plan uses UFS windows for OS/SystemOS and a separately allocated Data persistence window; neither is implemented for elish."]
procedure = ["Read block capacity and logical block size from `/dev/block/sda`, export primary and backup GPT sectors with `adb exec-out dd`, then validate GPT header/partition-array CRCs and compare partition bounds against the device capacity. Review UFS/SMMU ownership and storage ABI before enabling the controller or creating images.", "Ran `./unixnu build userdata --dry-run -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 --ipsw /root/elish-build-20261123/UniXNU/.cache/firmware/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw`, then built the local userdata-root image and independently verified its SHNGROOT manifest and both embedded window hashes. Full details are in reports/elish-userdata-build-20261124.md.", "Compared the extracted elish UFSDxe PE32 and alioth/pipa catalog binaries by SHA-256, decoded the catalog DEPEX, and used Ghidra 12.2 headless analysis to trace its protocol GUIDs into SmemDxe and SPMIDxe. Commands and output are summarized in reports/elish-offline-audit-20261124.md."]
findings = ["Root ADB measurements resolve the userdata partition geometry. The primary and backup GPT copies agree, partition 34 ends at the last usable LBA, and its byte size matches the previously measured fastboot capacity.", "The earlier inherited enuma values implied a partition size that conflicted with the confirmed device capacity and remain removed.", "The 9,382,658,048-byte userdata-root host image contains the target IPSW OS and SystemOS windows and fits the measured partition. Its SHNGROOT manifest and both embedded hashes validate. The System-role APFS volume superblock has a valid Fletcher64 checksum and UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, matching board.toml. This verifies the IPSW root identity, not a device-side mount. UFS/SMMU ownership remains open.", "The pinned ShengUfs source is explicitly SM8550-scoped, matches `qcom,sm8550-ufshc`, and hardcodes SM8550 GCC registers plus SMMU stream 0x60. Stock elish uses `qcom,ufshc`, and the stock UFS node does not record an SMMU stream. A source build alone cannot qualify this driver for elish.", "NativeUfs-alioth revision 336680c353e6c3f25d6b29284532c4fd16104f68 adds the generic qcom,ufshc match and documents SM8250 stream IDs 0xe0 and 0x4e0. Its GCC inputs remain labeled SM8550-derived, and no elish runtime result is recorded. Treat it as a source candidate while elish stream ownership is unknown.", "The NativeUfs-alioth source defaults to stream 0x60 and accepts 0xe0/0x4e0 through boot arguments. Its README ties the latter to alioth's existing SMMU mappings. The stock elish DT has no iommus property. GccUfs.h labels its clock registers SM8550-derived, and reset, RPMh, TCSR and QMP-PHY programming remain undefined, so this source is a command/transport reference rather than a selectable elish component.", "The NativeUfs-alioth GccUfs.h values are explicitly SM8550-derived. Its PHY AHB/AXI, ICE, auxiliary, lane and aggregate clock offsets differ from the pinned SM8250 Linux GCC source. The stock elish overlay also uses GCC clock IDs that differ from several IDs in the upstream SM8250 binding. Keep alioth register constants and stream IDs board-specific to alioth until the Xiaomi provider and elish runtime ownership are resolved.", "The elish stock XBL UFSDxe PE32 is byte-identical to the alioth and pipa Mu-Silicium catalog modules (118784 bytes, SHA-256 ffeaed467f8251b7e30a45075da84a1c563e2bac7dc4be0f79f0ed49a88b8dc9). Their shared DEPEX requires protocol GUIDs f4e5c7d0-d239-47cb-aacd-7f66ef763238 and fa5f306b-f47d-4ac4-a47d-882f8204ec30. Ghidra analysis of the catalog providers confirms SmemDxe and SPMIDxe install these interfaces. The elish stock SmemDxe hash matches the catalogs; the elish stock SPMI hash also matches the catalogs, and stock NpaDxe installs the NPA GUID queried by UFSDxe. XBL uefiplat.cfg records EnableUfsIOC=0 and UfsSmmuConfigForOtherBootDev=1, matching elish ConfigurationMapLib. ClockDxe, CmdDbDxe, PwrUtilsDxe, RpmhDxe, HWIODxeDriver and VcsDxe also match pipa/alioth catalog hashes, while DALSys is an elish-specific variant. The UFS binary names NpaProtocol, IOMMU ARIDs 0x0/0x10, UfsSmmuConfigForOtherBootDev, EnableUfsIOC and nine GCC UFS/PHY clocks. This narrows firmware inputs while leaving elish clock, SMMU, reset, RPMh, TCSR and QMP-PHY setup unresolved. See reports/elish-offline-audit-20261124.md."]
completion = ["Controller and DMA facts match hardware; capacity/GPT and known reads are correct; OS/SystemOS mount; Data writes survive the specified restart and recovery checks."]
limits = ["UFS controller/PHY ownership, DMA/SMMU setup, device-side APFS root mount and Data persistence are not verified. The configured root UUID matches the System-role volume in the target IPSW. The stock Android FDT contains no UFS SMMU stream assignment, and the pinned SM8550 driver assumes stream 0x60."]
next_action = ["Continue offline comparison of SM8250 SoC UFS, PHY and SMMU sources. Keep the controller disabled until elish-specific DMA and initialization ownership is established."]
evidence = [{kind = "host", reference = "reports/elish-userdata-build-20261124.md", result = "Built and read-back verified the 8.74 GiB SHNGROOT host image from the pinned 21H461 IPSW. Verified the APFS System-role volume UUID against board.toml. The board configuration was an uncommitted working-tree input. The image has not been flashed or tested through elish UFS.", command = "./unixnu build userdata -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 --ipsw /root/elish-build-20261123/UniXNU/.cache/firmware/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed stock vendor_boot v3, selected DTBO entry 12 by elish model and board ID, merged it into the Kona v2.1 base DTB, and recorded UFS/PHY resources. Compared the stock properties with the pinned ShengUfs source scope. No device access was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "2b6638be3e5630969e316dd1755065542fcee505"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed the stock vendor_boot v3 DTB set, selected the elish overlay by board ID, reviewed UFS/PHY resources and compared official and community driver scope. No device command was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Reviewed NativeUfs-alioth source at the pinned revision. The SM8250 stream values are alioth-specific, the default remains 0x60, and the clock/reset/PHY inputs are not established for elish. No driver was enabled or integrated.", command = "git -C /tmp/elish-NativeUfs-alioth rev-parse HEAD && rg -n 'SM8250|0xe0|0x4e0|qcom,ufshc|GCC|reset|QMP' /tmp/elish-NativeUfs-alioth", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Compared pinned Linux v6.6 SM8250 GCC and UFS PHY definitions with NativeUfs-alioth's GccUfs.h and the stock elish DT clock/reset specifiers. Several alioth register offsets differ from the SoC source, and the vendor overlay clock IDs do not directly match the upstream binding. No UFS code was enabled.", command = "sha256sum /tmp/elish-gcc-sm8250.c /tmp/elish-linux-qcom,gcc-sm8250.h /tmp/elish-linux-phy-qcom-qmp-ufs.c", revision = "166235ec2480ff0992627b7aafa15c65ce6b4efa"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "The elish stock UFSDxe PE32 exactly matches alioth and pipa catalog binaries. The shared catalog DEPEX protocol GUIDs were traced to SmemDxe and SPMIDxe InstallMultipleProtocolInterfaces calls. Elish SmemDxe, SPMI, NpaDxe and UFSDxe PE32 hashes match pipa/alioth catalog copies. NpaDxe installs the GUID queried by UFSDxe. Board initialization inputs remain open. Details and additional module hashes are in reports/elish-offline-audit-20261124.md.", command = "JAVA_HOME=/opt/jdk-25 PATH=/opt/jdk-25/bin:$PATH /opt/ghidra-12.2/ghidra_12.2_PUBLIC/support/analyzeHeadless /tmp/elish-ghidra-projects ElishUfs -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/UFSDxe/UFSDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SmemDxe/SmemDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SPMIDxe/SPMIDxe.efi -overwrite -analysisTimeoutPerFile 180 -max-cpu 8 -scriptPath /tmp/elish-ghidra-scripts -postScript AuditUfsProtocols.java", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38"}]

