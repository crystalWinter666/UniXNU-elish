configuration = ["check-elish.py validates static board inputs and the runtime-managed memory, userdata GPT and UEFI readiness required by the package build."]
procedure = ["Keep build output, image hashes, source revisions and any authorized boot observations with the corresponding porting record entry."]
findings = ["A successful warm reset followed by fastboot continue and root ADB yielded a 21189-byte pstore capture of the pre-BDS memory probe. The HII-order image reached the menu and later returned through USB mass storage with no readable pstore.", "The preflight has a static-only mode for host validation and a strict default mode for build gating.", "The original full image and FDT memory-map probe were accepted by RAM-only fastboot boot and returned to Android without captured UEFI, DarwinBoot or XNU output. The later XNU entry image enabled blue and magenta entry bars and a six-second stage-3 reset after MMU enable. USB returned to Android about 17 seconds after fastboot enumeration, consistent with the configured three-second menu timeout and probe delay. This suggests the post-MMU probe ran, but no screen or serial evidence confirms it. The command, image hash and timing are in reports/elish-xnu-entry-probe-20261124.md.", "Root Recovery ADB now provides a Linux 4.19.325 FDT and /proc/iomem capture for the two DRAM banks. These establish the Recovery kernel's resource view. The UEFI GetMemoryMap descriptors, Qualcomm RAM Partition entries and final ExitBootServices map remain unobserved. See reports/elish-recovery-memory-map-20261124.md.", "A device trace captured two FV HOBs, successful FVB installation, and EFI_ACCESS_DENIED from GetFwVolHeader on both handles. The FDF now sets READ_ENABLED_CAP and READ_STATUS on both firmware volumes. The memory-map probe uses DEBUG_ERROR because DEBUG_INFO is filtered by the elish 0x8007EE0F debug mask.", "The user-provided frames show the Project Silicium elish title, validated 45-region MMU setup, successful PEI HOB construction, DXE Core entry and its Memory Allocation HOB dump. They do not show the custom probe marker or its RAM Partition/GetMemoryMap output. See reports/elish-live-uefi-hob-observation-20261124.md.", "Elish adapted the enuma warm-reset ramoops capture. A RAM-only boot recorded successful PcdDxe dispatch and reached CoreStartImage for EnvDxe; no return marker was captured. See reports/elish-uefi-ramoops-20261124.md.", "The device exported a 14317-byte ramoops log after the Info Blk repair. It confirms RAM Partition protocol installation and a later missing HII String protocol assertion in ConPlatformDxe. The follow-up run with corrected HII ordering reached Android USB mass-storage mode after fastboot continue, with no readable pstore.", "2026-11-24: Recovery after run03/run04 used fastboot boot of the backed-up LineageOS reader, followed by adb root/pstore export. Do not use fastboot continue, which led to mass storage or shutdown. Wait for actual enumeration, allowing 120 seconds; the loader probe timeout itself is 20 seconds. Run05 probing stopped after that deadline; the user was asked to reboot directly into root ADB. See reports/elish-loader-fat-initrd-20261124.md", "2026-11-25: The user photo shows DarwinBoot's green handoff band, 256 MiB window and entry-register output; EBS is confirmed, but no blue/magenta entry band or XNU checkpoint is visible. The source image identity is unknown. A six-second entry-reset image was accepted by fastboot and Android ADB returned as lineage_elish; root ADB found an empty pstore, with the user's visual observation of colored bars still pending. See reports/elish-xnu-entry-retest-20261125.md.", "2026-11-25 run07: fastboot accepted the 67,751,936-byte entry-checkpoint image (SHA-256 38b548e03d2a0156f443e010cfdecca2becd7bc745f911a56dbb99e1b99c1e37). The terminal XNU patch appends its ramoops marker only when SCTLR_EL1.M=0 and ring metadata is valid; without a recovered pstore the marker and XNU entry are unconfirmed. USB disconnect/re-enumeration is inconclusive. The user currently reports fastboot, while the latest host snapshot enumerated no tablet. See reports/elish-xnu-entry-checkpoint-20261125.md.", "Offline audit compared Linux v4.19 persistent_ram_buffer and the elish RamLogWrite implementation. A marker can be appended only while the ring is unwrapped with enough contiguous space. The run07 writer missed the exact-capacity wrap of start; scripts/patch-xnu-ramoops-checkpoint.py now wraps it. A temporary kernel copy assembled to 276 bytes (SHA-256 0ad2ca17724f66adf25afd473008e9c47842c2b00d55d8b1ec79ba6c40b9086f); run08 was then built offline with the corrected writer: the 64 MiB payload SHA-256 is ab5b2b00fc2fa592bf71434e01c93fd793ff48d6c13aa763a45ecdaae297ac1d and the 67,751,936-byte boot image SHA-256 is 9cd0577439a5f143ff11d81cdaa6aece79da01a25cfd5cfdf67ddea0a7a5075a. It was later RAM-booted; root ADB recovered no pstore files and reported an invalid deflate size, so the checkpoint remains unconfirmed. See reports/elish-xnu-entry-checkpoint-run08-20261125.md.", "2026-11-25 run09: the close photo directly shows DarwinBoot green EBS, XNU stage-1 blue and stage-2 magenta pre-MMU bands, confirming XNU execution through the pre-MMU checkpoint. The image includes a six-second post-MMU PSCI reset, but fastboot return does not independently prove that stage. The configured pmsg marker was absent from the empty pstore. The original boot_b backup was restored and the reader returned root LineageOS ADB. See reports/elish-xnu-entry-visual-retest-20261125.md.", "2026-11-25 run18: built a separate post-VM marker kernel and DEBUG-only pmsg readback image. The kernel writes magic/complement at 0xb03ff000 only after `_arm_vm_init` returns; the UEFI probe reads it before its EBS stop. Both images are host-built and untested on elish; the current direct stage remains pre-MMU. See reports/elish-run18-post-vm-pmsg-20261125.md."]
completion = ["Every claimed milestone has a reproducible command, matching source/image revision and accessible result."]
limits = ["Run04/run06/run11/run18/run19 logs confirm ExitBootServices. The run09 photo directly shows XNU through its pre-MMU stage, and the six-second stage-3 reset/USB timeline meets the documented MMU-enable criterion. Run13 and run17 reset timing is indirect; run18's pmsg return marker is invalid, so _arm_vm_init return remains unconfirmed. Kernel relocation, ABI and runtime qualifications remain false; UFS/APFS root startup and userspace are not verified."]
next_action = ["The run09 six-second stage-3 reset/USB timeline meets the documented MMU-enable criterion. Resolve why run18's return marker reads invalid, then use a screen-visible checkpoint immediately after _arm_vm_init returns; retain the reader/pstore workflow for logs.", "The run19 valid SMMU tuple maps to MDSS SDE, while UFS stream/DMA mode remain unknown. Establish the elish UFS path and runtime memory ownership before attempting device APFS root mounting."]
evidence = [{ kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "scripts/check-elish.py --static-only passed. Runtime memory ownership remains unverified.", command = "python3 scripts/check-elish.py --static-only", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "host", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Built the routine FD with the FVB read-status fix and a separate diagnostic memory-map DXE. The diagnostic image contains no iPadOS payload.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot accepted the iPadOS image and the FDT memory-map probe. Android USB returned after each boot. The probe FDT property could not be read after ADB authorization was lost.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-memory-map-fdt-probe.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted the 67,727,360-byte RAM-only entry-probe image. Android USB returned about 17 seconds after fastboot enumeration, consistent with the configured menu timeout and six-second post-MMU reset. This is indirect evidence only because no screen or serial output was captured. ADB returned unauthorized. No partition was written.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-entry-reset.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot getvar confirmed product elish. Fastboot accepted the current 67,727,360-byte image, then ADB identified stock Android 13 V816.0.2.0.TKYCNXM. No UEFI/DarwinBoot/XNU logs were captured, and Android shell could not read pstore.", command = "fastboot -s ELISH_SERIAL getvar product && fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/boot.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted elish-xnu-arm-vm-return.img and Android USB returned. Host USB logs show a disconnect at 20:09:13 and Android enumeration at 20:09:26. This timing is indirect and does not confirm the _arm_vm_init return marker.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-arm-vm-return.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }, { kind = "device", reference = "reports/elish-xnu-entry-retest-20261125.md", result = "Fastboot product was elish and accepted the six-second entry-reset image; ADB returned as lineage_elish. Root pstore was empty. No visual confirmation of XNU entry or MMU enable is recorded.", command = "fastboot -s 4bed07e4 getvar product && fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-entry-reset.img && adb -s 4bed07e4 root && adb -s 4bed07e4 shell ls -l /sys/fs/pstore", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "device", reference = "reports/elish-xnu-entry-checkpoint-run08-20261125.md", result = "Fastboot 37.0.3 verified product=elish and accepted the corrected run08 image RAM-only. The user photo shows the green ExitBootServices handoff. Root ADB found an empty pstore and Invalid compression size for deflate: 0; no XNU entry marker was recovered, so entry remains unconfirmed.", command = "fastboot -s 4bed07e4 getvar product && fastboot -s 4bed07e4 boot run08-xnu-entry-checkpoint-corrected/boot.img && fastboot -s 4bed07e4 boot backups/lineage-reader-boot.img && adb -s 4bed07e4 root && adb -s 4bed07e4 shell ls -la /sys/fs/pstore", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905" }, {kind = "device", reference = "reports/elish-xnu-entry-visual-retest-20261125.md", result = "Fastboot 37.0.3 verified product=elish and flashed run09 to active boot_b successfully. The user photo directly shows the green EBS, blue XNU-entry and magenta pre-MMU bands. The pmsg marker was not recovered from root reader ADB; original boot_b was restored successfully.", command = "fastboot -s 4bed07e4 flash boot_b run09/boot.img; fastboot reboot; fastboot -s 4bed07e4 flash boot_b backups/boot_b.img; fastboot -s 4bed07e4 boot backups/lineage-reader-boot.img; adb -s 4bed07e4 root; adb -s 4bed07e4 shell ls -la /sys/fs/pstore", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}]
