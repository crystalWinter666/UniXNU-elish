name: package

# 设备打包 action（docs/porting/packaging.md）。平台种子来自仓库 secret UNIXNU_UNIQUE_CHIP_ID，
# 烧进镜像里，所以一次运行的产物只属于一台设备：下载后删除该运行。在设备仓库的 fork 里运行。

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17", "26", "27"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 8542980d02b4d2cc5c32ee3542de1760b2562aac
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: crystalWinter666/uefi-elish
          ref: f03839d31a3f07e9e4b032fcf850ac0dfb9961a0
          path: uefi-elish
          submodules: recursive   # the firmware volume builds from the checkout's submodules
      - name: elish build support
        run: git -C UniXNU apply ../device/patches/unixnu-build-support.patch
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-elish
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/elish/*/*/boot/boot.img
            UniXNU/out/elish/*/*/payload/payload.img
            UniXNU/out/elish/*/*/kernel/kernel.macho
            UniXNU/out/elish/*/*/package.manifest.json
