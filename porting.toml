schema_version = 1

[device]
name = "elish"
soc = "SM8250-AC"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 5 Pro Wi-Fi (M2105K81AC). Run56 verified the full 21H461 System APFS root and SystemOS union on UFS and confirmed Apple launchd reaching main as PID 1. Setup and persistent Data remain untested."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["AGENTS.md", "README.md", "board.toml", "feeds.toml", "unixnu.lock", "configs/**", "dts/**", "local.toml.example", "package/unixnu.toml", ".github/workflows/porting-record.yml", "scripts/build-loader-probe.py", "scripts/patch-xnu-ramoops-checkpoint.py", "patches/unixnu-fat-initrd.patch", "patches/darwinboot-fat-initrd.patch", "reports/elish-loader-fat-initrd-20261124.md", "reports/elish-initrd-layout-20261124.txt", "reports/elish-darwinboot-ebs-20261124.txt"]
inputs = ["Read-only Android identity: M2105K81AC/elish, SM8250-AC soc_id 356 revision 2.1, CPUs 0-7, display 1600x2560; Linux MemTotal is 7775836 kB and is not a DRAM map.", "UniXNU profile ipados-17.7.11-21H461 selects iPad7,1/J120AP."]
configuration = ["board.toml identifies Wi-Fi elish and the target OS profile; feeds.toml and unixnu.lock contain matching pins for all nine declared Git sources.", "Stage 1 selects only ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; memory and UEFI readiness remain gated. The measured userdata geometry is recorded in [userdata].", "The complete kernel archive array retains the inherited build-mockfs-fixture.py after SoftwareAES bindings.", "package/LinkStubs.c defines the optional arm64_platform_sleep_hook as null so static kernel linkers can resolve ArmCpu's weak import; platform sleep remains disabled by default.", "[package] unixnu points to the sibling UniXNU checkout, matching the package wrapper's relative-path contract."]
procedure = ["Ran elish_defconfig, status --json, record validation, static preflight, tree assembly and release --check --no-deps; the patch plan contains 62 entries.", "On the current Linux host, scripts/check-elish.py --static-only passed and dtc -I dts -O dtb compiled the board DTS to /tmp/elish-check.dtb (SHA-256 34e4b5d32942f829d1e44211cc7939b0265d25ff41dd4019f820939ee81d3293).", "Ran ./scripts/package.sh --check --os ipados-17.7.11-21H461; dependencies, target IPSW inputs, defconfig, and all 62 patches resolved. The fetch normalized the generated unixnu.lock header without changing pinned commits."]
findings = ["The Wi-Fi elish target is distinct from 5G enuma. The sibling Format 2 draft had copied enuma's userdata geometry and an unverified DRAM size; those values are no longer used.", "The format2-device branch has an independent history in the core repository; CI uses the previous commit on that branch instead of comparing it with the unrelated core main branch.", "The package wrapper's ../UniXNU-elish default resolved back to this device checkout; it now names the core repository directory, ../UniXNU.", "A kernel build exposed that replacing inherited archive arrays also omitted build-mockfs-fixture.py; the XNU link required its generated archive because CONFIG_XNU_SOURCE_MOCKFS is enabled.", "The Linux cctools ld64 final-link test rejected the ArmCpu weak import when unresolved; the device link-stub archive now provides a null pointer definition, leaving platform sleep off unless explicitly enabled.", "2026-11-24: The board enables payload.adt.loader_inputs=true. run04 proved FAT discovery/EBS with an older ADT; run05 rebuilt and read back the property but did not return USB, so the runtime input record is pending recovery. See reports/elish-loader-fat-initrd-20261124.md", "The device build selects RamBlock through bind-elish-ram-block.py and supplies a 4 GiB XNU window. The resulting 21H461 Restore boot reached Apple PID 1 in run28.",
  "The opt-in loader probe manifest now records the reset and clock prerequisites for UFSHCI queue snapshots. The normal board profile excludes the diagnostic.",
  "The board enables the XNU source-storage root audit and SystemOS union startup. The UFS driver supplies the verified-media callbacks. Run56 confirmed the UFS System root and Apple launchd PID 1. Restore retains its separate RamBlock path.",
]
completion = ["The selected components and patch order appear in status; all declared source commits match unixnu.lock; board, README and porting record identify the same target."]
limits = ["Run56 validates an exact diagnostic image. Production prelink qualification fields remain false. Setup and Data persistence are untested."]
next_action = ["Qualify a RAM-only Setup candidate with a writable Data seed and retain the run56 UFS root policy."]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "proprietary-files.txt", "board.toml", "dts/**", "package/**", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-memory-map-probe-20261124.md", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md", "scripts/build-loader-probe.py", "scripts/patch-xnu-ramoops-checkpoint.py", "patches/unixnu-fat-initrd.patch", "patches/darwinboot-fat-initrd.patch", "reports/elish-loader-fat-initrd-20261124.md", "reports/elish-initrd-layout-20261124.txt", "reports/elish-darwinboot-ebs-20261124.txt", "reports/elish-iort-smmu-probe-20261125.md", "reports/elish-run18-run19-device-20261125.md", "reports/elish-run18-pmsg-readback-console-ramoops-20261125.txt", "reports/elish-run19-iort-smmu-console-ramoops-20261125.txt"]
inputs = ["The stock ROM directory /root/repo/elish_os1.0.2.0 contains 28 image files (about 8.2 GB). vendor.img is ext4 and its build.prop confirms Xiaomi/elish, M2105K81AC, Android 13 V816.0.2.0.TKYCNXM. Relevant image and installed-slot hashes are recorded in HANDOFF.md and the UEFI porting record.", "The supplied xbl.img SHA-256 is 9a3a3bb92e6cf478b227f70dd1bd140fde32982994a6c34a07bd314ea0acb72f. Its embedded uefiplat.cfg records the UEFI FD, stack, DXE heap and display reservation. The selected PlatConfigFileName is uefiplatLA.cfg, whose contents and lookup source remain unresolved. Details are in the UEFI Platforms/Xiaomi/elishPkg/PORTING.md and reports/elish-xbl-config-lookup-20261124.md.", "The XBL firmware volume contains candidate SimpleTextInOutSerial, DisplayDxe and UFSDxe modules. The extracted elish UFSDxe PE32 SHA-256 is ffeaed467f8251b7e30a45075da84a1c563e2bac7dc4be0f79f0ed49a88b8dc9 and matches alioth and pipa catalog copies. DisplayDxe SHA-256 is 6c6351c3c770d4f698e5e22097021fe8d20d35a8d4181df05676a48c4347f425. No candidate has been copied into the elish FD.", "The stock XBL EnvDxe PE32 hash 62e81b81dc507a5ecd2e9e2d732c3e642c7c107bcdd51a236bbc029800b645ed and SmemDxe PE32 hash 4ad21b61ab64d1d91403403c8ce23b60648a2fb29c781fe4a7cb5a3996d727aa match alioth and pipa catalog binaries. EnvDxe contains the RAM Partition protocol path. Android does not export the SMEM table or UEFI memory map through the available read-only interfaces.", "The elish UEFI checkout uses Mu-Silicium revision 66421cb7bb5694843aec8de1ca3d1de4c20cca38 and Mu_Basecore revision cfb93724a06ff86ff5ba971413368a7809ee42a5. Its embedded memory map is static configuration evidence. Live FDT and RAM Partition entries agree on two DRAM banks. run04 and run06 captured successful final UEFI GetMemoryMap/ExitBootServices snapshots; run06 has 72 descriptors.", "Catalog UFSDxe DEPEX protocol GUIDs were statically traced to SmemDxe and SPMIDxe InstallMultipleProtocolInterfaces calls. The elish stock SmemDxe matches the catalog hash. The elish stock SPMI PE32 hash matches the catalog. Stock NpaDxe also matches and installs UFSDxe protocol GUID 79d6c870-725e-489e-a0a1-27e7a5d0cb35. XBL uefiplat.cfg sets EnableUfsIOC=0 and UfsSmmuConfigForOtherBootDev=1, matching elish ConfigurationMapLib. Runtime storage initialization remains unresolved. Full module comparison is in reports/elish-offline-audit-20261124.md."]
configuration = ["board.toml selects Platforms/Xiaomi/elishPkg/elish.dsc and Resources/Configs/elish.toml. The DSC/FDF include the elish memory/configuration maps, EnvDxe, SmemDxe, RamManagerDxe, optional ElishMemoryMapProbeDxe, UniXNU, DarwinBoot, UniXNURamDiskDxe, DiskIoDxe and FAT support.", "The current board sets ELISH_MEMORY_MAP_PROBE=FALSE and ELISH_LOADER_PROBE=FALSE, and enables DEBUG-only ELISH_RAMOOPS_LOG. The elish FDF enables READ_ENABLED_CAP and READ_STATUS on both firmware volumes so the DXE FVB can read them.", "The separate ElishLoaderProbeDxe uses direct ramoops writes and defaults to a 20-second timeout. With ELISH_LOADER_PROBE_RUN_KERNEL=TRUE it permits a diagnostic XNU checkpoint after successful ExitBootServices; the default probe captures the accepted map and warm-restarts without XNU.", "The separate ELISH_LOADER_PROBE_SMMU=TRUE diagnostic reads IORT and SMMUv2 without modifying registers. Its run19 device capture found no IORT in the active ACPI configuration; SID 0x820 remains unattributed and UFS DMA is disabled."]
procedure = ["Parsed the XBL firmware volume read-only and recorded the UEFI FD, stack, DXE heap and display reservation in the elish UEFI package notes. Compared the XBL display reservation with the live FDT and identified a 1 MiB size difference.", "Read the active slot, XBL partition hashes and ROM-length prefixes over root ADB. The active slot is _b, both slot pairs match, and the installed XBL/XBL config prefixes match the supplied ROM files byte-for-byte.", "Searched XBL FV PE32 sections for the RAM Partition protocol GUID. EnvDxe is the only match. Its PE32 hash matches catalog copies and its strings identify the SMEM memory-partition-table path. Android exports no debugfs or /dev/mem interface for reading that table.", "Initialized pinned Mu_Basecore submodules and ran `make -C BaseTools/Source/C -j8`, then built the elish FD with `./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8`. The 3 MiB FD build succeeded. Details are recorded in reports/elish-uefi-build-20261124.md.", "Built a firmware-only Android v3 probe image with `./unixnu bootimg`; its pack/unpack verification passed. It has an empty ramdisk and is not an iPadOS image. Added and compiled the optional ElishMemoryMapProbeDxe, then built a separate diagnostic image that prints the RAM Partition protocol and pre-application UEFI memory map to the framebuffer. Initial callback-based images were accepted by fastboot but produced no captured output.", "Installed hash-verified Ghidra 12.2 and Temurin JDK 25 outside the repositories, then analyzed xbl.img read-only with analyzeHeadless. The function and configuration findings are recorded in reports/elish-xbl-config-lookup-20261124.md.", "A screen capture showed two FV HOBs and successful FVB installation, followed by EFI_ACCESS_DENIED from GetFwVolHeader on both handles. FwVolBlockReadBlock returns this status when EFI_FVB2_READ_STATUS is clear. Added READ_ENABLED_CAP=TRUE and READ_STATUS=TRUE to both FV sections, rebuilt the 3 MiB FD, and verified attributes 0x000C0C06 and 0x00030C06. The corrected firmware-only Android v3 image was accepted by fastboot boot. The user reported reaching the installed system, and adb devices identified lineage_elish. No partition write was run.", "Built separate 600-second probe images with synchronous DXE entry, APRIORI ordering and direct console output. The user later supplied four frames showing the Silicium title, 45-region MMU validation, successful platform HOB construction, DXE Core entry and memory-allocation HOB rows. The screenshots do not show the custom probe marker or its RAM Partition and GetMemoryMap output. The HOB rows and public pipa cross-check are transcribed in reports/elish-live-uefi-hob-observation-20261124.md."]
findings = ["The HII-order image reached the menu. Run04 subsequently confirms FAT config discovery and DarwinBoot EBS, superseding the earlier unknown handoff stage. XNU execution is unverified.", "The supplied stock image directory has no GPT/rawprogram layout file. The only raw-byte occurrence of uefiplatLA.cfg is the XBL reference; the vendor /firmware directory listing has no same-named file. No proprietary image has been copied into this repository.", "The XBL configuration display reservation is 0x9c000000+0x02400000. The live FDT reports 0x9c000000+0x02300000. The embedded PIL range is 0x86000000+0x0d200000, while the live FDT lists PIL and secure ranges from 0x86200000 through 0x92700000. The DBI Dump 0x9e400000+0x00f00000 is tagged NoHob/MMAP_IO, while Linux /proc/iomem reports it as System RAM. The selected uefiplatLA.cfg and active UEFI map remain unresolved.", "EnvDxe is the only XBL FV PE32 containing the RAM Partition protocol GUID and matches the alioth/pipa catalog binary. The built FD includes EnvDxe, SmemDxe and RamManagerDxe. The Qualcomm RAM Partition entries and 47 pre-BDS descriptors were captured in the earlier ramoops run; run04 now also captures the accepted final ExitBootServices map. XNU memory ownership remains to be verified.", "The diagnostic FD is 3,145,728 bytes with SHA-256 8f797816d1b3ac59338c248a7ed17442d4f3878e5abc2fae80314811d6967548. The earlier 618,496-byte firmware-only image remains available with SHA-256 8b08c449b4af3a4ab13c07389a789c170a83d6c373b68dfe76dc959224fef349. The second DRAM bank endpoint was corrected to 0x280000000 from the live FDT, superseding earlier diagnostic-build hashes. The instrumented 622,592-byte Android v3 image has SHA-256 b2ccb5968d7cb30a462bf0f1c6deca84167ccb10c7f7a36782e07559c0fbf6d6. Both images have empty ramdisks. The instrumented image was accepted by fastboot, then the target disappeared from USB enumeration; no screen output was captured and no partition-write command was run. A rebuilt 120-second diagnostic image is 622592 bytes with SHA-256 f312ddfa2adacd2a48ef3d09e313765b668b1affe7e710426b3e3411fcd1e650 and has not yet been booted.", "After the diagnostic image produced no captured framebuffer output, the user directed that device detection attempts stop while offline work continues. The routine board firmware define now excludes ElishMemoryMapProbeDxe.", "Headless XBL analysis found FUN_9fc107e0 requesting uefiplat.cfg through FUN_9fc12890 and parsing Config, MemoryMap, RegisterMap, ConfigParameters and ChipIDConfig. FUN_9fc10e14 stores ConfigParameters as key/value pairs. The embedded values name uefiplatLA.cfg and OsTypeString LA, while the consumer and source of that file remain unresolved.", "The first firmware trace identified missing READ_STATUS bits in both generated FV headers as the cause of the DXE dispatcher failure. The permanent FDF correction is retained, and temporary Mu_Basecore trace instrumentation has been removed. See reports/elish-dxe-fv-read-status-20261124.md.", "A fixed-FV RAM-only boot returned the device to its installed lineage_elish system. The first memory-map probe used DEBUG_INFO, which is filtered by the configured 0x8007EE0F debug mask. The rebuilt DEBUG_ERROR probe output has not yet been observed.", "The user-provided screen frames identify Project Silicium for Xiaomi Xiaomi Pad 5 Pro Wi-Fi. They show MMU: 45 regions and map valid, SEC memory HOB completion, successful platform HOB construction, HOB list counts of 94 and 98, FV decompression, and DXE Core at 0x9b4c7000. The DXE Core HOB walk prints live allocation records including the 0x98900000-0x9bbfffff conventional DXE heap, the 0x9fc00000-0x9fefffff firmware volume, and the reserved 0xa0000000-0xafffffff kernel window. Full transcription, source correlation, image hashes and the public pipa map reference are in reports/elish-live-uefi-hob-observation-20261124.md.", "Two newly built 634,880-byte firmware-only Android v3 probes were accepted by fastboot while product was elish. The latest image, SHA-256 03b08a9f39c09038d2c4f57c5b0df0fbb754f6e23964d7a9c40507e2b5027cd0, has a 120-second hold after the probe display routine returns; Android ADB re-enumerated within 10 seconds. This does not establish whether the DXE driver ran or the platform Stall call advanced. The previously booted FDT probe property was absent from Android /chosen. No UEFI descriptors were captured and no partition was written. See reports/elish-memory-map-probe-20261124.md.", "Elish adapted the enuma warm-reset ramoops capture. A RAM-only boot recorded successful PcdDxe dispatch and reached CoreStartImage for EnvDxe; no return marker was captured. See reports/elish-uefi-ramoops-20261124.md.", "Enabling PcdBuildXblHobs restored the Info Blk HOB. On elish, EnvDxe then installed the RAM Partition protocol and dispatch advanced to the ConPlatformDxe HII assertion. HiiDatabaseDxe now precedes ConPlatformDxe in APRIORI. The HII-order image returned to fastboot after a RAM-only boot; USB storage enumeration after continue prevented log extraction.", "2026-11-24: Run03 directly measured gzip vendor data before FAT at unaligned offset 0x11f0abb. Shared UniXNURamDiskDxe now preserves the full initrd disk and publishes a validated FAT32 suffix child; DarwinBoot validates the child and original raw parent. Run04 loaded config, selected xnu and accepted EBS with matching snapshot key, then intentionally reset without XNU execution. See reports/elish-loader-fat-initrd-20261124.md", "2026-11-25 run18: Built and RAM-booted the post-VM marker image, then RAM-booted the pmsg readback image. The readback logged magic 0x4000 and complement 0, invalid; _arm_vm_init return is unconfirmed. The readback console directly re-confirmed FAT payload, the 256 MiB window and ExitBootServices success, then stopped before XNU. See reports/elish-run18-run19-device-20261125.md.", "2026-11-25 run19: The enhanced read-only probe found no IORT in the active ACPI configuration and read SID 0x820/mask 0x402/context bank 4 with S1 disabled. The SID remains unattributed to UFS. It captured successful ExitBootServices and stopped before XNU. See reports/elish-run18-run19-device-20261125.md and reports/elish-run19-iort-smmu-console-ramoops-20261125.txt.", "The read-only ElishLoaderProbeDxe integration and SMMU/IORT diagnostics were committed and pushed in the UEFI repository at crystalWinter666/uefi-elish revision d489a050255f90b9c011d25b95c15c1b12f382f0.", "The recorded run28 firmware entered DarwinBoot and handed off the 21H461 Restore payload in a RAM-only boot. The close-up shows green, blue, magenta and cyan checkpoints.",
  "Run35 extends the diagnostic-only UEFI hook with gated UFSHCI queue register reads. The DEBUG FD built successfully and remains untested on hardware.",
  "Run42 used the opt-in loader probe to read six OS/SystemOS layout samples after validating both GPTs. The probe stopped its queue and warm-restarted before DarwinBoot. Run56 used the separate firmware handoff that preserves the measured routes and leaves UFS commands to XNU.",
]
completion = ["The firmware enters UniXNU, publishes a validated framebuffer, exposes the initrd volume and preserves a measured memory map."]
limits = ["Run56 qualifies the firmware handoff for the tested warm-boot image through XNU UFS reads and PID 1. UFS cold initialization and full peripheral memory ownership remain unverified."]
next_action = ["Preserve the measured UFS handoff in later RAM-only candidates and verify it separately if the firmware boot path changes."]
evidence = [{ kind = "source", reference = "reports/elish-uefi-build-20261124.md", result = "The instrumented elish FD and 622,592-byte firmware-only Android v3 probe build successfully. A prior fastboot boot was accepted, then the target disappeared from USB enumeration. No framebuffer output was captured, so callback execution and reported memory remain unverified. Per the user's direction, device detection and diagnostic boot attempts are suspended while host work continues. Full build and historical result are in reports/elish-uefi-build-20261124.md." }, { kind = "host", reference = "reports/elish-uefi-build-20261124.md", result = "Rebuilt the 3 MiB routine FD with ELISH_MEMORY_MAP_PROBE=FALSE. FVMAIN.Fv.txt, FVMAIN.Fv.map and FVMAIN.inf contain no ElishMemoryMapProbeDxe entry. SHA-256 is 5c1cc81f58df5e255ea2e87e29169ae17e3f8aecbce464feb9ff16df13ba0b3e. No device operation was run.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "host", reference = "reports/elish-xbl-config-lookup-20261124.md", result = "Ghidra analyzed the supplied XBL as AArch64 ELF and identified the uefiplat.cfg lookup and ConfigParameters handler. It did not locate the uefiplatLA.cfg consumer or file source.", command = "analyzeHeadless /tmp/elish-ghidra-projects ElishXbl -import /root/repo/elish_os1.0.2.0/xbl.img -postScript FindElishCfgReferences.java", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "host", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Built a routine 3 MiB FD with both FV read-status bits set and a separate 622,592-byte visible-output memory-map probe image. The probe PE32 contains the expected DEBUG_ERROR output strings. The routine board setting remains ELISH_MEMORY_MAP_PROBE=FALSE.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Fastboot accepted the corrected RAM-only image. The user reported reaching the installed system, and ADB enumeration identified lineage_elish on M2105K81AC. No partition-write command was run.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/elish-dxe-fv-readable.img", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-live-uefi-hob-observation-20261124.md", result = "Four user-provided screen frames show the elish Silicium title, successful 45-region MMU validation, HOB construction, DXE Core entry and runtime memory-allocation HOB rows. Source code and public pipa configuration cross-check the legible ranges. The custom probe marker, RAM Partition entries and full UEFI GetMemoryMap are absent.", command = "sha256sum /root/repo/IMG_3176(20261124-144243).PNG /root/repo/IMG_3177(20261124-144250).PNG /root/repo/IMG_3182(20261124-145145).PNG /root/repo/IMG_3183(20261124-145203).PNG", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-uefi-ramoops-20261124.md", result = "Warm reset and Android pstore export preserved the pre-return EnvDxe dispatch marker, with a successful PcdDxe dispatch earlier in the same log.", command = "fastboot boot boot.img && fastboot continue; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-uefi-info-hob-20261124.md", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38", command = "fastboot boot boot.img && fastboot continue; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Restoring Info Blk allowed EnvDxe to register RAM Partition and DXE to reach ConPlatformDxe, which asserted on missing HII String protocol." }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/**", "configs/elish_defconfig"]
inputs = ["Android reports CPUs 0-7 present. CPU topology, GICv3 and timer details come from the pinned SM8250 SoC source, not an elish XNU boot."]
configuration = ["ArmCpu is selected in stage 1; CPU nodes and interrupt handling are supplied by the SoC package."]
procedure = ["Build and boot only after memory and firmware inputs are verified; check each CPU entry and timer/IPI behavior separately."]
findings = ["Android reports the expected CPU count. The stage-1 DTS inherits the SM8250 CPU topology.", "Run28 reaches Apple PID 1 on the boot CPU. Run56 reaches PID 1 through the System boot path with the same CPU configuration. Neither capture records per-core bring-up."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Secondary-core entry and per-core timer/IPI handling are unverified."]
