components = []
paths = ["reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "dts/elish.dts", "board.toml", "scripts/check-elish.py", "patches/xnu/elish-memory-excluded-ranges.patch", "reports/elish-offline-audit-20261124.md", "reports/elish-memory-handoff-xnu-backport-20261124.md", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-xnu-entry-probe-20261124.md", "reports/elish-recovery-memory-map-20261124.md", "reports/elish-recovery-proc-iomem-20261124.txt", "reports/elish-recovery-proc-meminfo-20261124.txt", "reports/elish-recovery-cmdline-20261124.txt", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md", "scripts/build-loader-probe.py", "scripts/patch-xnu-ramoops-checkpoint.py", "patches/unixnu-fat-initrd.patch", "patches/darwinboot-fat-initrd.patch", "reports/elish-loader-fat-initrd-20261124.md", "reports/elish-initrd-layout-20261124.txt", "reports/elish-darwinboot-ebs-20261124.txt"]
inputs = ["Root ADB exported /sys/firmware/fdt (845892 bytes, SHA-256 90cf1d5333e758f001a8e21ed4e78fc000ebf3b5502338f010435a2da292a663). Its live memory node reports 0x80000000+0x3bb00000 and 0xc0000000+0x1c0000000. The FDT has 22 fixed and 12 dynamic reserved-memory children; the full list and /proc/iomem capture are in reports/elish-live-hardware-20261123.md. A follow-up root ADB check found no /sys/firmware/memmap, /sys/kernel/debug or /dev/mem interface, and no RAM Partition table information in pstore or dmesg. The live /soc/qcom,smem node is bound to qcom-smem and references no-map smem_region@80900000 at 0x80900000+0x200000, but exports no SMEM nvmem device or /dev node.", "Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, ran as root on Linux 4.19.325-cip136-st20-perf-g6b34d2476532. Its FDT reports the same two DRAM banks; the raw FDT, /proc/iomem, /proc/meminfo and cmdline, hashes, and interpretation are recorded in reports/elish-recovery-memory-map-20261124.md.", "Core revision 71c5c6569bae6369c0e0f634df8b9bd5afc19139 requires one contiguous hardware memory range in scripts/unixnu/devicetree.py. The upstream iPadOS profile has no excluded-range consumer. Device patch elish-memory-excluded-ranges.patch adds that consumer to XNU 10063.141.1, and board.toml requests 16 excluded-range slots. The RAM Partition table and pre-BDS UEFI map have been captured. Run04 and run06 captured accepted final handoff maps; run06 has 72 descriptors. XNU use of the selected window remains unverified."]
configuration = ["dts/elish.dts declares both root-ADB-measured DRAM banks. board.toml uses memory_map=runtime-managed and payload.dram_size=0x200000000. DarwinBoot obtains usable runs from the current UEFI map and the ADT reserves a 256 MiB owned window with 16 excluded-range slots for the target XNU consumer.", "The device XNU patch consumes /chosen/darwinboot-memory-excluded. The 64 MiB payload and Android v3 image now build on the host. Runtime descriptor values and the actual DarwinBoot allocation still require device confirmation."]
procedure = ["Read /sys/firmware/fdt and /proc/iomem over root ADB, decoded both DRAM tuples and all reserved-memory children, and configured the measured banks in the DTS. The supplied firmware screenshots were then checked against the DXE Core HOB printer and the elish XBL-derived map. The full UEFI map and DarwinBoot allocation remain to be observed.", "Booted Recovery and read /sys/firmware/fdt, /proc/iomem, /proc/meminfo and /proc/cmdline through root ADB. Saved the raw captures and hashes in reports/elish-recovery-memory-map-20261124.md.", "Audited the pinned DarwinBoot AllocateWindow/AllocateSpan branches and the target XNU arm_vm_init consumer. Ran the DarwinBoot memory-window, ADT-window and loader-input host tests against their synthetic-map models.", "Added the XNU excluded-range consumer in the device patch series and built the full target kernel. Ran the normal device package check, production DarwinBoot Mach-O parser, and all 65 XnuPrelink tests."]
findings = ["The ramoops probe recorded both Qualcomm RAM Partition banks and 47 pre-BDS UEFI DRAM descriptors. Both banks match the live Linux FDT. Run04 records the final accepted DarwinBoot map and selected 256 MiB XNU window; XNU use of that window remains unverified.", "The measured DRAM banks total 0x1fbb00000 bytes and are separated by a 0x4500000-byte gap. The DTS exposes both measured banks. The Recovery FDT independently reports the same tuples. Its /proc/iomem records Linux System RAM resource extents with nested reserved and kernel code/data ranges. This confirms the Linux Recovery view, not firmware ownership. The shared ADT generator describes a contiguous hardware envelope, while DarwinBoot uses the runtime UEFI map to select usable pages and reports firmware-owned exclusions to XNU. A spanning envelope includes the gap, so the hardware range and loader-managed window remain distinct.", "The upstream iPadOS profile has no consumer for darwinboot-memory-excluded. The device patch adds a target-XNU parser that validates, clips, page-aligns, sorts and merges ranges, protects the kernel early allocation region, excludes pages from pmap/VM accounting, and leaves those physmap ranges unmapped. The board requests the excluded-range table with 16 slots.", "The supplied frames show the runtime DXE Core memory-allocation HOB dump. Readable ranges include the conventional DXE heap 0x98900000-0x9bbfffff and reserved kernel window 0xa0000000-0xafffffff, matching named rows in the elish XBL-derived map and public pipa configuration. HOB allocation records do not expose the full GetMemoryMap or Qualcomm RAM Partition table. The HOB evidence and exact transcription are in reports/elish-live-uefi-hob-observation-20261124.md.", "A RAM-only image with the UniXNU entry bars and six-second post-MMU reset returned to Android about 17 seconds after fastboot enumeration, consistent with the menu timeout, XNU probe delay and Android return. No display or serial output was captured, so this is indirect evidence of reaching the post-MMU XNU stage. See reports/elish-xnu-entry-probe-20261124.md.", "The ramoops dispatch trace reaches the driver start call for EnvDxe, the candidate RAM Partition protocol provider. Its return status, RAM Partition table, and UEFI descriptors remain unobserved.", "EnvDxe installed the Qualcomm RAM Partition protocol on elish after the Info Blk HOB was restored. The host-built DEBUG map probe writes the protocol entries and pre-BDS UEFI descriptors to ramoops. The diagnostic image captured the pre-BDS map on elish. This earlier run captured the pre-BDS map; run04 subsequently captured the accepted ExitBootServices map.", "2026-11-24: Run04 directly captured the accepted EBS map: key 0x3ee, 73 descriptors, window 0xc007c000+0x10000000, head 0x6040000 EfiLoaderCode and remaining bytes EfiConventionalMemory, zero exclusions. The composite initrd remains in the reserved low kernel range outside the window. XNU ownership and DMA are unverified. See reports/elish-loader-fat-initrd-20261124.md", "2026-11-25 run09 close photo directly shows the blue XNU-entry and magenta pre-MMU bands after the green EBS band. This confirms XNU execution through the pre-MMU checkpoint, but does not confirm MMU enable or runtime memory ownership. The pmsg checkpoint was not recovered; see reports/elish-xnu-entry-visual-retest-20261125.md.", "2026-11-25 run18 host checkpoint: after `_arm_vm_init` returns, the diagnostic kernel writes a magic/complement pair to the reserved pmsg page `0xb03ff000` via `_ml_phys_write`; the DXE readback image logs the marker and first 48 pmsg bytes. Both images build, but neither has run on the device, so MMU completion and memory ownership remain unverified. See reports/elish-run18-post-vm-pmsg-20261125.md.", "Run20 captured the accepted 4 GiB map at ExitBootServices, and run28 reached Apple PID 1 with a restore ramdisk and the same configured window size.",
  "Run33 ID2 encodes 36-bit apps-SMMU IAS, OAS and UBS. These capabilities do not identify a UFS mapping or establish reachability of XNU DMA buffers.",
  "The XNU UFS archive adopts the measured bypass routes, bounds its physically contiguous DMA arena below 4 GiB, and maintains dedicated cache lines for the descriptors and data. Run46 verified the arena at 0xD0132000 with seven known-block reads and unchanged SMMU fault status. Run56 passed the root digest bundle through a separate DarwinBoot RootPolicies extent.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine uses a documented, verified allocation and cache policy."]
limits = ["UFS read DMA is verified for the tested arena and inherited routes. Ownership of other peripherals' buffers remains open."]
next_action = ["Verify the range and cache policy of each additional DMA engine before enabling it."]
evidence = [{ kind = "host", reference = "reports/elish-memory-handoff-xnu-backport-20261124.md", result = "The device series applies 63 patches. Target XNU and XnuPrelink build successfully, and the production DarwinBoot Mach-O parser accepts the 51,122,176-byte candidate. The board requests 16 excluded-range slots. XnuPrelink qualification remains false, and runtime memory ownership remains unverified.", command = "./unixnu build kernel -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 -j 8", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "device", reference = "reports/elish-live-uefi-hob-observation-20261124.md", result = "The user-provided screenshots show the validated 45-region PEI table, successful HOB construction, DXE Core entry and named live allocation HOBs. They confirm the first-bank firmware allocation regions but do not include the full UEFI memory map, RAM Partition ranges or the DarwinBoot allocation.", command = "sha256sum /root/repo/IMG_3176(20261124-144243).PNG /root/repo/IMG_3177(20261124-144250).PNG /root/repo/IMG_3182(20261124-145145).PNG /root/repo/IMG_3183(20261124-145203).PNG", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-recovery-memory-map-20261124.md", result = "Root Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, captured the Linux 4.19.325 FDT, /proc/iomem, /proc/meminfo and cmdline. The two FDT DRAM tuples match the configured banks. This establishes Linux-visible memory resources only; UEFI descriptors and RAM Partition entries remain unobserved.", command = "adb -s ELISH_SERIAL shell 'id; uname -a; cat /proc/cmdline; cat /proc/meminfo; cat /proc/iomem' && adb -s ELISH_SERIAL pull /sys/firmware/fdt reports/elish-recovery-fdt-20261124.dtb", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }, {kind = "device", reference = "reports/elish-xnu-entry-visual-retest-20261125.md", result = "The user photo directly shows the green EBS, blue XNU-entry and magenta pre-MMU bands. XNU reached the pre-MMU checkpoint; the post-MMU stage and runtime memory ownership remain unverified.", command = "fastboot -s 4bed07e4 flash boot_b run09/boot.img; fastboot reboot; fastboot -s 4bed07e4 flash boot_b backups/boot_b.img", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}]

