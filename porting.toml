inputs = ["UEFI screen output is captured in four user-provided frames. One RAM-only entry-probe run has indirect USB timing consistent with the post-MMU XNU checkpoint, but no screen recording or serial log was captured. ADB authorization was unavailable after that run. Root Recovery ADB is now available and its Linux memory-map evidence is recorded separately in reports/elish-recovery-memory-map-20261124.md."]
configuration = ["check-elish.py validates static board inputs and the runtime-managed memory, userdata GPT and UEFI readiness required by the package build."]
procedure = ["Keep build output, image hashes, source revisions and any authorized boot observations with the corresponding porting record entry."]
findings = ["A successful warm reset followed by fastboot continue and root ADB yielded a 21189-byte pstore capture of the pre-BDS memory probe. The HII-order image reached the menu and later returned through USB mass storage with no readable pstore.", "The preflight has a static-only mode for host validation and a strict default mode for build gating.", "The original full image and FDT memory-map probe were accepted by RAM-only fastboot boot and returned to Android without captured UEFI, DarwinBoot or XNU output. The later XNU entry image enabled blue and magenta entry bars and a six-second stage-3 reset after MMU enable. USB returned to Android about 17 seconds after fastboot enumeration, consistent with the configured three-second menu timeout and probe delay. This suggests the post-MMU probe ran, but no screen or serial evidence confirms it. The command, image hash and timing are in reports/elish-xnu-entry-probe-20261124.md.", "Root Recovery ADB now provides a Linux 4.19.325 FDT and /proc/iomem capture for the two DRAM banks. These establish the Recovery kernel's resource view. The UEFI GetMemoryMap descriptors, Qualcomm RAM Partition entries and final ExitBootServices map remain unobserved. See reports/elish-recovery-memory-map-20261124.md.", "A device trace captured two FV HOBs, successful FVB installation, and EFI_ACCESS_DENIED from GetFwVolHeader on both handles. The FDF now sets READ_ENABLED_CAP and READ_STATUS on both firmware volumes. The memory-map probe uses DEBUG_ERROR because DEBUG_INFO is filtered by the elish 0x8007EE0F debug mask.", "The user-provided frames show the Project Silicium elish title, validated 45-region MMU setup, successful PEI HOB construction, DXE Core entry and its Memory Allocation HOB dump. They do not show the custom probe marker or its RAM Partition/GetMemoryMap output. See reports/elish-live-uefi-hob-observation-20261124.md.", "Elish adapted the enuma warm-reset ramoops capture. A RAM-only boot recorded successful PcdDxe dispatch and reached CoreStartImage for EnvDxe; no return marker was captured. See reports/elish-uefi-ramoops-20261124.md.", "The device exported a 14317-byte ramoops log after the Info Blk repair. It confirms RAM Partition protocol installation and a later missing HII String protocol assertion in ConPlatformDxe. The follow-up run with corrected HII ordering reached Android USB mass-storage mode after fastboot continue, with no readable pstore."]
completion = ["Every claimed milestone has a reproducible command, matching source/image revision and accessible result."]
limits = ["The final ExitBootServices map and XNU entry remain unobserved. Timing suggests the XNU entry probe reached its post-MMU point, but that stage lacks screen or serial confirmation. Kernel relocation, ABI and runtime qualifications remain false, and the UFS/APFS root path is not implemented."]
next_action = ["Capture the selected DarwinBoot memory window and the final ExitBootServices map, then verify the XNU entry with a direct checkpoint."]
evidence = [
  { kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "scripts/check-elish.py --static-only passed. Runtime memory ownership remains unverified.", command = "python3 scripts/check-elish.py --static-only", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" },
  { kind = "host", reference = "reports/elish-dxe-fv-read-status-20261124.md", result = "Built the routine FD with the FVB read-status fix and a separate diagnostic memory-map DXE. The diagnostic image contains no iPadOS payload.", command = "./unixnu build firmware -D /root/repo/UniXNU-elish --uefi /root/repo/uefi-elish --edk2 /root/repo/uefi-elish/Mu_Basecore -j 8", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" },
  { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot accepted the iPadOS image and the FDT memory-map probe. Android USB returned after each boot. The probe FDT property could not be read after ADB authorization was lost.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-memory-map-fdt-probe.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" },
  { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted the 67,727,360-byte RAM-only entry-probe image. Android USB returned about 17 seconds after fastboot enumeration, consistent with the configured menu timeout and six-second post-MMU reset. This is indirect evidence only because no screen or serial output was captured. ADB returned unauthorized. No partition was written.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-entry-reset.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" },
  { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Fastboot getvar confirmed product elish. Fastboot accepted the current 67,727,360-byte image, then ADB identified stock Android 13 V816.0.2.0.TKYCNXM. No UEFI/DarwinBoot/XNU logs were captured, and Android shell could not read pstore.", command = "fastboot -s ELISH_SERIAL getvar product && fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/boot.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" },
  { kind = "device", reference = "reports/elish-xnu-entry-probe-20261124.md", result = "Fastboot accepted elish-xnu-arm-vm-return.img and Android USB returned. Host USB logs show a disconnect at 20:09:13 and Android enumeration at 20:09:26. This timing is indirect and does not confirm the _arm_vm_init return marker.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/diagnostics/elish-xnu-arm-vm-return.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" },
]
