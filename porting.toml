components = []
paths = ["reports/elish-uefi-pre-bds-memory-map-20261124.md", "reports/elish-uefi-pre-bds-memory-map-20261124.txt", "dts/elish.dts", "board.toml", "scripts/check-elish.py", "patches/xnu/elish-memory-excluded-ranges.patch", "reports/elish-offline-audit-20261124.md", "reports/elish-memory-handoff-xnu-backport-20261124.md", "reports/elish-live-uefi-hob-observation-20261124.md", "reports/elish-xnu-entry-probe-20261124.md", "reports/elish-recovery-memory-map-20261124.md", "reports/elish-recovery-proc-iomem-20261124.txt", "reports/elish-recovery-proc-meminfo-20261124.txt", "reports/elish-recovery-cmdline-20261124.txt", "reports/elish-uefi-ramoops-20261124.md", "reports/elish-uefi-info-hob-20261124.md", "scripts/build-loader-probe.py", "scripts/patch-xnu-ramoops-checkpoint.py", "patches/unixnu-fat-initrd.patch", "patches/darwinboot-fat-initrd.patch", "reports/elish-loader-fat-initrd-20261124.md", "reports/elish-initrd-layout-20261124.txt", "reports/elish-darwinboot-ebs-20261124.txt"]
inputs = ["Root ADB exported /sys/firmware/fdt (845892 bytes, SHA-256 90cf1d5333e758f001a8e21ed4e78fc000ebf3b5502338f010435a2da292a663). Its live memory node reports 0x80000000+0x3bb00000 and 0xc0000000+0x1c0000000. The FDT has 22 fixed and 12 dynamic reserved-memory children; the full list and /proc/iomem capture are in reports/elish-live-hardware-20261123.md. A follow-up root ADB check found no /sys/firmware/memmap, /sys/kernel/debug or /dev/mem interface, and no RAM Partition table information in pstore or dmesg. The live /soc/qcom,smem node is bound to qcom-smem and references no-map smem_region@80900000 at 0x80900000+0x200000, but exports no SMEM nvmem device or /dev node.", "Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, ran as root on Linux 4.19.325-cip136-st20-perf-g6b34d2476532. Its FDT reports the same two DRAM banks; the raw FDT, /proc/iomem, /proc/meminfo and cmdline, hashes, and interpretation are recorded in reports/elish-recovery-memory-map-20261124.md.", "Core revision 71c5c6569bae6369c0e0f634df8b9bd5afc19139 requires one contiguous hardware memory range in scripts/unixnu/devicetree.py. The upstream iPadOS profile has no excluded-range consumer. Device patch elish-memory-excluded-ranges.patch adds that consumer to XNU 10063.141.1, and board.toml requests 16 excluded-range slots. The RAM Partition table and pre-BDS UEFI map have been captured. Run04 and run06 captured accepted final handoff maps; run06 has 72 descriptors. XNU use of the selected window remains unverified."]
configuration = ["dts/elish.dts declares both root-ADB-measured DRAM banks. board.toml uses memory_map=runtime-managed and payload.dram_size=0x200000000. DarwinBoot obtains usable runs from the current UEFI map and the ADT reserves a 256 MiB owned window with 16 excluded-range slots for the target XNU consumer.", "The device XNU patch consumes /chosen/darwinboot-memory-excluded. The 64 MiB payload and Android v3 image now build on the host. Runtime descriptor values and the actual DarwinBoot allocation still require device confirmation."]
procedure = ["Read /sys/firmware/fdt and /proc/iomem over root ADB, decoded both DRAM tuples and all reserved-memory children, and configured the measured banks in the DTS. The supplied firmware screenshots were then checked against the DXE Core HOB printer and the elish XBL-derived map. The full UEFI map and DarwinBoot allocation remain to be observed.", "Booted Recovery and read /sys/firmware/fdt, /proc/iomem, /proc/meminfo and /proc/cmdline through root ADB. Saved the raw captures and hashes in reports/elish-recovery-memory-map-20261124.md.", "Audited the pinned DarwinBoot AllocateWindow/AllocateSpan branches and the target XNU arm_vm_init consumer. Ran the DarwinBoot memory-window, ADT-window and loader-input host tests against their synthetic-map models.", "Added the XNU excluded-range consumer in the device patch series and built the full target kernel. Ran the normal device package check, production DarwinBoot Mach-O parser, and all 65 XnuPrelink tests."]
findings = ["The ramoops probe recorded both Qualcomm RAM Partition banks and 47 pre-BDS UEFI DRAM descriptors. Both banks match the live Linux FDT. Run04 records the final accepted DarwinBoot map and selected 256 MiB XNU window; XNU use of that window remains unverified.", "The measured DRAM banks total 0x1fbb00000 bytes and are separated by a 0x4500000-byte gap. The DTS exposes both measured banks. The Recovery FDT independently reports the same tuples. Its /proc/iomem records Linux System RAM resource extents with nested reserved and kernel code/data ranges. This confirms the Linux Recovery view, not firmware ownership. The shared ADT generator describes a contiguous hardware envelope, while DarwinBoot uses the runtime UEFI map to select usable pages and reports firmware-owned exclusions to XNU. A spanning envelope includes the gap, so the hardware range and loader-managed window remain distinct.", "The upstream iPadOS profile has no consumer for darwinboot-memory-excluded. The device patch adds a target-XNU parser that validates, clips, page-aligns, sorts and merges ranges, protects the kernel early allocation region, excludes pages from pmap/VM accounting, and leaves those physmap ranges unmapped. The board requests the excluded-range table with 16 slots.", "The supplied frames show the runtime DXE Core memory-allocation HOB dump. Readable ranges include the conventional DXE heap 0x98900000-0x9bbfffff and reserved kernel window 0xa0000000-0xafffffff, matching named rows in the elish XBL-derived map and public pipa configuration. HOB allocation records do not expose the full GetMemoryMap or Qualcomm RAM Partition table. The HOB evidence and exact transcription are in reports/elish-live-uefi-hob-observation-20261124.md.", "A RAM-only image with the UniXNU entry bars and six-second post-MMU reset returned to Android about 17 seconds after fastboot enumeration, consistent with the menu timeout, XNU probe delay and Android return. No display or serial output was captured, so this is indirect evidence of reaching the post-MMU XNU stage. See reports/elish-xnu-entry-probe-20261124.md.", "The ramoops dispatch trace reaches the driver start call for EnvDxe, the candidate RAM Partition protocol provider. Its return status, RAM Partition table, and UEFI descriptors remain unobserved.", "EnvDxe installed the Qualcomm RAM Partition protocol on elish after the Info Blk HOB was restored. The host-built DEBUG map probe writes the protocol entries and pre-BDS UEFI descriptors to ramoops. The diagnostic image captured the pre-BDS map on elish. This earlier run captured the pre-BDS map; run04 subsequently captured the accepted ExitBootServices map.", "2026-11-24: Run04 directly captured the accepted EBS map: key 0x3ee, 73 descriptors, window 0xc007c000+0x10000000, head 0x6040000 EfiLoaderCode and remaining bytes EfiConventionalMemory, zero exclusions. The composite initrd remains in the reserved low kernel range outside the window. XNU ownership and DMA are unverified. See reports/elish-loader-fat-initrd-20261124.md", "2026-11-25 run09 close photo directly shows the blue XNU-entry and magenta pre-MMU bands after the green EBS band. This confirms XNU execution through the pre-MMU checkpoint, but does not confirm MMU enable or runtime memory ownership. The pmsg checkpoint was not recovered; see reports/elish-xnu-entry-visual-retest-20261125.md.", "2026-11-25 run18 host checkpoint: after `_arm_vm_init` returns, the diagnostic kernel writes a magic/complement pair to the reserved pmsg page `0xb03ff000` via `_ml_phys_write`; the DXE readback image logs the marker and first 48 pmsg bytes. Both images build, but neither has run on the device, so MMU completion and memory ownership remain unverified. See reports/elish-run18-post-vm-pmsg-20261125.md."]
completion = ["All handoff regions are accounted for and each enabled DMA engine uses a documented, verified allocation and cache policy."]
limits = ["Run04 directly verifies FAT config discovery, DarwinBoot allocation and EBS in the recorded working tree. XNU initialization, runtime memory ownership and DMA remain unverified. Run05 did not return USB and awaits pstore recovery."]
next_action = ["Add a visible checkpoint immediately after _arm_vm_init returns and resolve the invalid run18 pmsg marker; then establish runtime memory ownership before production kernel validation."]
evidence = [{ kind = "host", reference = "reports/elish-memory-handoff-xnu-backport-20261124.md", result = "The device series applies 63 patches. Target XNU and XnuPrelink build successfully, and the production DarwinBoot Mach-O parser accepts the 51,122,176-byte candidate. The board requests 16 excluded-range slots. XnuPrelink qualification remains false, and runtime memory ownership remains unverified.", command = "./unixnu build kernel -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 -j 8", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" }, { kind = "device", reference = "reports/elish-live-uefi-hob-observation-20261124.md", result = "The user-provided screenshots show the validated 45-region PEI table, successful HOB construction, DXE Core entry and named live allocation HOBs. They confirm the first-bank firmware allocation regions but do not include the full UEFI memory map, RAM Partition ranges or the DarwinBoot allocation.", command = "sha256sum /root/repo/IMG_3176(20261124-144243).PNG /root/repo/IMG_3177(20261124-144250).PNG /root/repo/IMG_3182(20261124-145145).PNG /root/repo/IMG_3183(20261124-145203).PNG", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38" }, { kind = "device", reference = "reports/elish-recovery-memory-map-20261124.md", result = "Root Recovery ADB on M2105K81AC/elish, serial ELISH_SERIAL, captured the Linux 4.19.325 FDT, /proc/iomem, /proc/meminfo and cmdline. The two FDT DRAM tuples match the configured banks. This establishes Linux-visible memory resources only; UEFI descriptors and RAM Partition entries remain unobserved.", command = "adb -s ELISH_SERIAL shell 'id; uname -a; cat /proc/cmdline; cat /proc/meminfo; cat /proc/iomem' && adb -s ELISH_SERIAL pull /sys/firmware/fdt reports/elish-recovery-fdt-20261124.dtb", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" }, { kind = "device", reference = "reports/elish-loader-fat-initrd-20261124.md", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0", command = "adb reboot bootloader; fastboot getvar product; fastboot boot run04-fat-child/boot.img; fastboot boot backups/lineage-reader-boot.img; adb root; adb exec-out cat /sys/fs/pstore/console-ramoops-0", result = "Working tree over recorded source baselines: FAT config, xnu entry, DarwinBoot request, 256 MiB window and EBS Success with accepted-snapshot=1. The probe reset before XNU. Log SHA-256 507186f7e5b12ccb5b32c45c31b761c752fa329ff3a9812b8ef08109a9ad1f97. run05 later did not return USB; its pstore is pending." }, {kind = "device", reference = "reports/elish-xnu-entry-visual-retest-20261125.md", result = "The user photo directly shows the green EBS, blue XNU-entry and magenta pre-MMU bands. XNU reached the pre-MMU checkpoint; the post-MMU stage and runtime memory ownership remain unverified.", command = "fastboot -s 4bed07e4 flash boot_b run09/boot.img; fastboot reboot; fastboot -s 4bed07e4 flash boot_b backups/boot_b.img", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["board.toml", "dts/elish.dts", "configs/**", "package/**", "reports/elish-userdata-build-20261124.md", "reports/elish-stock-storage-audit-20261124.md", "reports/elish-offline-audit-20261124.md", "reports/elish-unixnu-reference-audit-20261124.md", "reports/elish-smmu-readonly-probe-20261125.md", "reports/elish-run11-smmu-context-console-ramoops-20261125.txt", "reports/elish-ufs-host-audit-20261125.md", "reports/elish-pstore-ufs-live-20261125.md", "reports/elish-ufs-kona-clock-map-20261125.md", "reports/elish-ufs-uefi-arid-audit-20261125.md", "reports/elish-progress-20261125-1605.md", "scripts/audit-ufs-dxe-ghidra/**", "reports/elish-live-ufs-smmu-20261125.txt", "reports/elish-ufs-reference-audit-20261125.md", "reports/elish-run06-smmu-console-ramoops-20261125.txt"]
inputs = ["Read-only root ADB identifies UFS route 1d84000.ufshc and `/dev/block/sda` capacity 253461790720 bytes, with 4096-byte logical blocks and 61880320 LBAs. GPT partition 34 `userdata` spans inclusive LBAs 6619136–61870314, or 226308829184 bytes. Primary and backup GPT headers and arrays pass CRC checks, and both arrays are byte-identical. Export hashes and the read commands are recorded in reports/elish-live-hardware-20261123.md.", "The active Android kernel binds `1d84000.ufshc` (`qcom,ufshc`) to `ufshcd-qcom` and `1d87000.ufsphy_mem` (`qcom,ufs-phy-qmp-v4`) to `ufs_qcom_phy_qmp_v4`. Live FDT exposes controller `reg=<0x1d84000 0x3000 0x1d90000 0x8000>`, interrupt specifier `<0 0x109 4>`, a two-lane PHY at `0x1d87000`, and core, bus, interface, UniPro, ICE, reference and lane-sync clocks. The host node has no `iommus` property or `iommu_groups` link. This records the Android binding and FDT only; UEFI/DarwinBoot DMA ownership and SMMU stream IDs remain unverified. Details are in reports/elish-live-hardware-20261123.md.", "Offline extraction of stock vendor_boot v3 plus DTBO entry 12 (elish board ID 47) confirms UFS `0x1d84000+0x3000`, ICE `0x1d90000+0x8000`, QMP v4 PHY `0x1d87000+0xe00`, SPI 265, two lanes, nine clock names and core reset. The stock UFS node has no `iommus` property. Input hashes, extracted FDT hashes and commands are recorded in reports/elish-stock-storage-audit-20261124.md.", "The supplied ROM image directory contains no GPT/rawprogram layout file. fastboot getvar did not respond, so geometry was obtained from the running device's block device.", "Stock vendor_boot v3 and DTBO entry 12 identify the elish UFS/PHY/ICE windows, SPI 265, clock names and reset. The stock UFS node has no iommus property. Details and hashes are in reports/elish-stock-storage-audit-20261124.md.", "The pinned UniXNU-sm8250-common SoC package names Linux v6.6 revision 5b0764a53235d3c77e1ed674e836e1b3fe1a4b1f as its register source. Its gcc-sm8250.c and qcom,gcc-sm8250.h define a separate SoC baseline; SHA-256 values and the stock clock/reset specifier comparison are recorded in reports/elish-offline-audit-20261124.md.", "2026-11-25 live root ADB (Android 13 V816.0.2.0.TKYCNXM, Lineage kernel 4.19.325-cip136-st20-perf-g6b34d2476532, source 6b34d24765327d746074c8e53b5ad0d24a51acc7) confirms ufshcd-qcom, no UFS iommu_group, and /sys/module/arm_smmu/parameters/disable_bypass=Y. Its dmesg reports UFS host/PHY reinitialization and Gear 1 one-lane SLOWAUTO to Gear 4 two-lane FAST. Capture and hash: reports/elish-live-ufs-smmu-20261125.txt."]
configuration = ["Stage 1 does not enable UFS/PHY. board.toml [userdata] now records first_lba=6619136, last_lba=61870314 and lba_bytes=4096 with userdata_geometry=verified.", "The future plan uses UFS windows for OS/SystemOS and a separately allocated Data persistence window; neither is implemented for elish."]
procedure = ["Read block capacity and logical block size from `/dev/block/sda`, export primary and backup GPT sectors with `adb exec-out dd`, then validate GPT header/partition-array CRCs and compare partition bounds against the device capacity. Review UFS/SMMU ownership and storage ABI before enabling the controller or creating images.", "Ran `./unixnu build userdata --dry-run -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 --ipsw /root/elish-build-20261123/UniXNU/.cache/firmware/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw`, then built the local userdata-root image and independently verified its SHNGROOT manifest and both embedded window hashes. Full details are in reports/elish-userdata-build-20261124.md.", "Compared the extracted elish UFSDxe PE32 and alioth/pipa catalog binaries by SHA-256, decoded the catalog DEPEX, and used Ghidra 12.2 headless analysis to trace its protocol GUIDs into SmemDxe and SPMIDxe. Commands and output are summarized in reports/elish-offline-audit-20261124.md.", "Ran the NativeUfs host RootLayout, RootWindowRead, RootPublication and SmmuTakeover test binaries; all passed their synthetic cases. Adapted only the isolated `/tmp/elish-nativeufs-probe-only/tests` shims, then ran `check_arm64_root_commands.py` (five QEMU EL1 cases) and `check_legacy_descriptors.py` (14 comparisons); both passed. Exact outputs and scope are in reports/elish-ufs-host-audit-20261125.md."]
findings = ["Root ADB measurements resolve the userdata partition geometry. The primary and backup GPT copies agree, partition 34 ends at the last usable LBA, and its byte size matches the previously measured fastboot capacity.", "The earlier inherited enuma values implied a partition size that conflicted with the confirmed device capacity and remain removed.", "The 9,382,658,048-byte userdata-root host image contains the target IPSW OS and SystemOS windows and fits the measured partition. Its SHNGROOT manifest and both embedded hashes validate. The System-role APFS volume superblock has a valid Fletcher64 checksum and UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, matching board.toml. This verifies the IPSW root identity, not a device-side mount. UFS/SMMU ownership remains open.", "The pinned ShengUfs source is explicitly SM8550-scoped, matches `qcom,sm8550-ufshc`, and hardcodes SM8550 GCC registers plus SMMU stream 0x60. Stock elish uses `qcom,ufshc`, and the stock UFS node does not record an SMMU stream. A source build alone cannot qualify this driver for elish.", "NativeUfs-alioth revision 336680c353e6c3f25d6b29284532c4fd16104f68 adds the generic qcom,ufshc match and documents SM8250 stream IDs 0xe0 and 0x4e0. Its GCC inputs remain labeled SM8550-derived, and no elish runtime result is recorded. Treat it as a source candidate while elish stream ownership is unknown.", "The NativeUfs-alioth source defaults to stream 0x60 and accepts 0xe0/0x4e0 through boot arguments. Its README ties the latter to alioth's existing SMMU mappings. The stock elish DT has no iommus property. GccUfs.h labels its clock registers SM8550-derived, and reset, RPMh, TCSR and QMP-PHY programming remain undefined, so this source is a command/transport reference rather than a selectable elish component.", "The NativeUfs-alioth GccUfs.h values are explicitly SM8550-derived. Its PHY AHB/AXI, ICE, auxiliary, lane and aggregate clock offsets differ from the pinned SM8250 Linux GCC source. The stock elish overlay also uses GCC clock IDs that differ from several IDs in the upstream SM8250 binding. Keep alioth register constants and stream IDs board-specific to alioth until the Xiaomi provider and elish runtime ownership are resolved.", "The elish stock XBL UFSDxe PE32 is byte-identical to the alioth and pipa Mu-Silicium catalog modules (118784 bytes, SHA-256 ffeaed467f8251b7e30a45075da84a1c563e2bac7dc4be0f79f0ed49a88b8dc9). Their shared DEPEX requires protocol GUIDs f4e5c7d0-d239-47cb-aacd-7f66ef763238 and fa5f306b-f47d-4ac4-a47d-882f8204ec30. Ghidra analysis of the catalog providers confirms SmemDxe and SPMIDxe install these interfaces. The elish stock SmemDxe hash matches the catalogs; the elish stock SPMI hash also matches the catalogs, and stock NpaDxe installs the NPA GUID queried by UFSDxe. XBL uefiplat.cfg records EnableUfsIOC=0 and UfsSmmuConfigForOtherBootDev=1, matching elish ConfigurationMapLib. ClockDxe, CmdDbDxe, PwrUtilsDxe, RpmhDxe, HWIODxeDriver and VcsDxe also match pipa/alioth catalog hashes, while DALSys is an elish-specific variant. The UFS binary names NpaProtocol, IOMMU ARIDs 0x0/0x10, UfsSmmuConfigForOtherBootDev, EnableUfsIOC and nine GCC UFS/PHY clocks. This narrows firmware inputs while leaving elish clock, SMMU, reset, RPMh, TCSR and QMP-PHY setup unresolved. See reports/elish-offline-audit-20261124.md.", "2026-11-25: run06 and run11 RAM-only probes recovered 49,328- and 49,439-byte ramoops logs (SHA-256 fdaa24dcf70d4dbb41d63a49b2c705b8f7c33517128135c8439d56d6a9b1d7b2 and f16b04efae4fb5859b84b7f6351fe970de52d2b89cfaf7f3525a5239a48b8600). Both read all 87 apps-SMMU groups and found only group 4 valid (SID 0x820, MASK 0x402, S2CR type 0, context bank 4). Run11 read CBAR 0x1f000 (S1 translation/S2 bypass), SCTLR 0xe0 with M=0, TTBR0/TCR=0 and raw FSR 0x400; no S1 table is enabled. The mapping is not identified as UFS, and the stock elish UFS DT has no iommus property. The run06 image's MASK print included SMR_VALID; source now decodes bits 30:16 correctly. See reports/elish-smmu-readonly-probe-20261125.md.", "2026-11-25: RootLayout, RootWindowRead, RootPublication and synthetic SmmuTakeover host tests passed. Five QEMU ARM64 command cases and 14 legacy descriptor comparisons passed after test-shim fixes in `/tmp` only. The 9,382,658,048-byte host userdata root image hash is fd43ee7035ce185ce4215ac93fdc006fd784a54b3b7442e21457c226cbe03093; its 4 KiB manifest was parsed, not the complete image rehashed. These tests do not qualify hardware UFS/SMMU, APFS mounting or persistence. See reports/elish-ufs-host-audit-20261125.md.", "2026-11-25 correction: UFS/SDCC LocateProtocol calls query GUID 54b6d3b4-5d33-4f91-8600-6c41d5deb19a; the earlier 416c0086-ded5-9ab1-b673-0e22db6b1344 identification read from offset +8 and is withdrawn. Stock elish HALIOMMUDxe installs the queried GUID and its PE32 hash matches alioth/pipa catalog copies. Its attach implementation resolves device path plus ARID through ACPI IORT mappings and programs the SMMU. UFS passes ARIDs 0x0/0x10; the elish IORT mapping is not extracted, so run11 SID 0x820 remains unidentified. SDCC diagnostic labels say SDC2/SDC4 but both pass the SDC1 path. Keep UFS DMA disabled until elish IORT and runtime ownership are established. See reports/elish-ufs-uefi-arid-audit-20261125.md.", "2026-11-25 reference correction: an absent UFS iommus property/iommu_group does not prove physical bypass. The live SMMU disable_bypass parameter is Y; matching Linux source describes unmatched streams as faults. Android still uses UFS, so its exact route needs evidence; do not infer UFS SID or DMA mode. The same-SoC alioth source at 336680c353e6c3f25d6b29284532c4fd16104f68 and port record at 8540a2638aeb768567cc25f478572b7225be0a7d establish a useful command/root/userspace sequence, but its 0xe0/0x4e0 streams and SM8550-derived clocks are not elish values. See reports/elish-ufs-reference-audit-20261125.md."]
completion = ["Controller and DMA facts match hardware; capacity/GPT and known reads are correct; OS/SystemOS mount; Data writes survive the specified restart and recovery checks."]
limits = ["Android confirms the Samsung KLUEG8UHDC-B0E1 UFS device and a clean Gear 4, two-lane link, but this does not prove XNU controller/PHY ownership or DMA/SMMU setup. The run19 SID 0x820/mask 0x402 mapping is now attributed to MDSS SDE by live FDT; it is not UFS. The stock Android FDT has no UFS iommus assignment or iommu_group link, so UFS stream and DMA mode remain unknown. Kona clock/reset IDs and register offsets are mapped from stock DT plus Xiaomi Android R source, but active rates, RPMh votes, power rails, reset/PHY sequence and UEFI handoff state are unknown. Device-side APFS root mount and Data persistence remain unverified. The configured root UUID matches the System-role volume in the target IPSW; board.toml selects no UFS component."]
next_action = ["Add a read-only UEFI probe for the board-sourced GCC power/clock/reset state and SMMU global control/stream map. Read UFS controller registers only after confirming its power/access window; then establish UFS stream routing and DMA reachability before issuing bounded NOP/read-capacity commands. Android reports Gear 4 after reinitializing the host, while active UEFI state and UFS DMA ownership remain unknown. Keep DMA disabled until the elish handoff evidence exists."]
evidence = [{kind = "host", reference = "reports/elish-userdata-build-20261124.md", result = "Built and read-back verified the 8.74 GiB SHNGROOT host image from the pinned 21H461 IPSW. Verified the APFS System-role volume UUID against board.toml. The board configuration was an uncommitted working-tree input. The image has not been flashed or tested through elish UFS.", command = "./unixnu build userdata -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 --ipsw /root/elish-build-20261123/UniXNU/.cache/firmware/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed stock vendor_boot v3, selected DTBO entry 12 by elish model and board ID, merged it into the Kona v2.1 base DTB, and recorded UFS/PHY resources. Compared the stock properties with the pinned ShengUfs source scope. No device access was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "2b6638be3e5630969e316dd1755065542fcee505"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed the stock vendor_boot v3 DTB set, selected the elish overlay by board ID, reviewed UFS/PHY resources and compared official and community driver scope. No device command was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Reviewed NativeUfs-alioth source at the pinned revision. The SM8250 stream values are alioth-specific, the default remains 0x60, and the clock/reset/PHY inputs are not established for elish. No driver was enabled or integrated.", command = "git -C /tmp/elish-NativeUfs-alioth rev-parse HEAD && rg -n 'SM8250|0xe0|0x4e0|qcom,ufshc|GCC|reset|QMP' /tmp/elish-NativeUfs-alioth", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Compared pinned Linux v6.6 SM8250 GCC and UFS PHY definitions with NativeUfs-alioth's GccUfs.h and the stock elish DT clock/reset specifiers. Several alioth register offsets differ from the SoC source, and the vendor overlay clock IDs do not directly match the upstream binding. No UFS code was enabled.", command = "sha256sum /tmp/elish-gcc-sm8250.c /tmp/elish-linux-qcom,gcc-sm8250.h /tmp/elish-linux-phy-qcom-qmp-ufs.c", revision = "166235ec2480ff0992627b7aafa15c65ce6b4efa"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "The elish stock UFSDxe PE32 exactly matches alioth and pipa catalog binaries. The shared catalog DEPEX protocol GUIDs were traced to SmemDxe and SPMIDxe InstallMultipleProtocolInterfaces calls. Elish SmemDxe, SPMI, NpaDxe and UFSDxe PE32 hashes match pipa/alioth catalog copies. NpaDxe installs the GUID queried by UFSDxe. Board initialization inputs remain open. Details and additional module hashes are in reports/elish-offline-audit-20261124.md.", command = "JAVA_HOME=/opt/jdk-25 PATH=/opt/jdk-25/bin:$PATH /opt/ghidra-12.2/ghidra_12.2_PUBLIC/support/analyzeHeadless /tmp/elish-ghidra-projects ElishUfs -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/UFSDxe/UFSDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SmemDxe/SmemDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SPMIDxe/SPMIDxe.efi -overwrite -analysisTimeoutPerFile 180 -max-cpu 8 -scriptPath /tmp/elish-ghidra-scripts -postScript AuditUfsProtocols.java", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38"}, { kind = "host", reference = "reports/elish-smmu-readonly-probe-20261125.md", result = "Built the opt-in read-only SMMUv2 diagnostic image; build passed, device execution is pending.", command = "python3 scripts/build-loader-probe.py --smmu-readonly --payload /root/elish-build-20261123/UniXNU/out/elish-resume/elish/ipados-17.7.11-21H461/elish/payload/payload.img --dtb /tmp/elish-uefi-probe.dtb --out /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run06-smmu-readonly --clang-bin /usr/lib/llvm-21/bin --jobs 8", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0" }, { kind = "host", reference = "reports/elish-ufs-uefi-arid-audit-20261125.md", result = "Ghidra corrected the UFS/SDCC protocol GUID, matched the stock elish HALIOMMUDxe provider to the catalogs, and confirmed that the provider resolves ARIDs through ACPI IORT. The live elish mapping and run11 SID owner remain unknown.", command = "Ghidra 12.2 analyzeHeadless with AuditGuidXrefs.java at 0x19248, 0x17268 and 0x9048; see report for full commands and module extraction.", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905" }, {kind = "device", reference = "reports/elish-live-ufs-smmu-20261125.txt", result = "Read-only root ADB on elish confirms ufshcd-qcom, no UFS iommu_group link, and arm_smmu disable_bypass=Y. dmesg reports host/PHY reinitialization and Gear 1 one lane SLOWAUTO followed by Gear 4 two-lane FAST. This does not identify the UFS stream or DMA path. Capture SHA-256: 95402cb216f86c2c576ddbfed47d97def68b7b64ffd53efe90fc406362c09e56.", command = "adb -s 4bed07e4 shell cat /sys/module/arm_smmu/parameters/disable_bypass; adb -s 4bed07e4 shell readlink /sys/devices/platform/soc/1d84000.ufshc/driver; adb -s 4bed07e4 shell dmesg", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905"}]

