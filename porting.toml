paths = ["package/**", "dts/elish.dts", "configs/**"]
inputs = ["Root ADB reports NVTCapacitiveTouchScreen with ten slots, X 0–1599 and Y 0–2559, plus NVTCapacitivePen with X 0–12799, Y 0–20479, pressure 0–4095 and tilt -60..60. The live Novatek node uses SPI CS0 at 19.2 MHz and TLMM IRQ GPIO 39.", "Android dmesg reports NVT controller PID 5961, successful firmware update from `novatek_nt36523_k81a_fw01.bin` and firmware version 0x1a. Measurements and commands are in reports/elish-live-hardware-20261123.md."]
configuration = ["No touch or button driver is selected in stage 1. The measured controller and firmware variant are board inputs for a later kernel-stage driver."]
procedure = ["Confirm the active controller/firmware and coordinate orientation, then test contact, multitouch IDs, release events and buttons end to end."]
findings = ["Live FDT and Android logs identify the Novatek NT36523 device, SPI wiring, controller PID 5961 and active fw01 image. The input device advertises ten touch slots and a separate pen device. This does not verify the corresponding UniXNU event path.", "Run28 and run56 stop at diagnostic PID 1 checkpoints before interactive touch or pen testing."]
completion = ["Touch maps correctly; simultaneous contacts retain stable IDs; releases and physical buttons produce expected events."]
limits = ["No UniXNU touch, pen or button events have been tested on elish."]
next_action = ["After kernel entry and memory/storage bring-up, select an NT36523-compatible driver and verify multitouch, pen, release and button events on the device."]
