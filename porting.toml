inputs = [
  "Read-only root ADB identifies UFS route 1d84000.ufshc and /dev/block/sda capacity 253461790720 bytes, with 4096-byte logical blocks and 61880320 LBAs. GPT partition 34 userdata spans inclusive LBAs 6619136–61870314 (226308829184 bytes); primary/backup headers and arrays pass CRC checks. See reports/elish-live-hardware-20261123.md.",
  "Android binds 1d84000.ufshc to ufshcd-qcom and exposes its controller, ICE and QMP v4 PHY resources, SPI 265, two lanes and nine clocks. Its FDT has no iommus property, which does not establish the UEFI or XNU DMA route. Runs 36–40 later verify inherited UEFI routes and bounded read DMA; XNU DMA ownership remains unverified.",
  "Stock vendor_boot v3 and elish DTBO entry 12 identify UFS 0x1d84000+0x3000, ICE 0x1d90000+0x8000, QMP v4 PHY 0x1d87000+0xe00, SPI 265, two lanes, clock names and core reset. The stock UFS node has no iommus property. Hashes and extraction commands: reports/elish-stock-storage-audit-20261124.md.",
  "The supplied ROM directory has no GPT/rawprogram layout, and fastboot getvar did not respond; geometry came from the running device block node.",
  "The pinned UniXNU-sm8250-common package names Linux v6.6 revision 5b0764a53235d3c77e1ed674e836e1b3fe1a4b1f as its register source. It is a separate SoC baseline; hashes and clock/reset comparison: reports/elish-offline-audit-20261124.md.",
  "2026-11-25 root ADB on Android 13 V816.0.2.0.TKYCNXM, kernel 4.19.325-cip136-st20-perf-g6b34d2476532 (source 6b34d24765327d746074c8e53b5ad0d24a51acc7), reports ufshcd-qcom, no UFS iommu_group, and arm_smmu disable_bypass=Y. It records host/PHY reinitialization and Gear 1 one-lane SLOWAUTO to Gear 4 two-lane FAST. Capture: reports/elish-live-ufs-smmu-20261125.txt.",
  "2026-11-26 Android kernel logs show apps-SMMU groups and attachments for other clients but no UFS consumer/group log entry. This does not prove UFS bypass or identify its UEFI route. Capture and command: reports/elish-ufs-active-firmware-20261125.md."
]
configuration = ["The 4 GiB XNU profile selects RamBlock and prelinks 21H461 IOStorageFamily and APFS. The Restore payload uses a packed APFS ramdisk and its own boot UUID.", "The elish-ufs-root=1 RAM-only payload enables the XNU read-only block service with firmware-owned PHY, link and clock state. It selects the System IOMedia UUID in /chosen/root-matching. The UFS handoff diagnostic build preserves the routes through SEC."]
procedure = ["Read Android UFS capacity and GPT, validate both GPT CRCs and partition bounds against the live device.", "Build the host-only 21H461 userdata-root image and validate its manifest, embedded OS/SystemOS windows and System APFS UUID; this is not a device mount.", "With the verified elish identity, use RAM-only probes in order: bounded NOP, READ CAPACITY, known-block read, both GPT copies, then OS/SystemOS windows. Keep probes read-only and preserve a reader/recovery path.", "Integrate the board-qualified UFS transport and root publication in XNU; verify the System UUID and Apple launchd PID 1. Test Setup and Data persistence separately. Do not write a partition without a named target range and validated backup/recovery plan."]
findings = ["The 9,382,658,048-byte userdata-root image contains the target IPSW OS/SystemOS windows and System APFS UUID 04769D26-2CA0-4825-B443-E2E5F88300F2; this is host evidence, not a device mount.", "ShengUfs is SM8550-scoped and its stream/clock inputs do not match elish. NativeUfs-alioth and the shared Kona IORT template are references only; their stream IDs and SM8550-derived GCC values are not transferable without elish evidence.", "Run06/run11 found only SMMU group4 valid (SID 0x820, mask 0x402, CB4) with no enabled S1 translation; live FDT identifies SID 0x820 as MDSS SDE, not UFS. Run32 read apps-SMMU sCR0=0x00270406 (CLIENTPD=0, USFCFG=1); ACPI still has no IORT and the UFS SMMU route remains unresolved.", "Run30 captured UEFI Kona GCC branch state and all 87 SMMU groups. Run31/run32 confirmed the UFS PHY GDSC powered, core/interface gates enabled, and HCI CAP/VER/IS/HCS/HCE 0x1587031F/0x300/0x400/0x10F/0x1. Kona GCC source defines active-high core BCR bit 0. Raw zero places that reset line in deasserted state. PHY/ICE registers were not read. See reports/elish-run30-ufs-clocks-console-ramoops-20261125.txt and reports/elish-run31-ufs-hci-20261125.md.", "Android reports UFS suspended and PHY/card GDSCs disabled in that separate runtime; it does not describe the UEFI handoff. UniXNU has not issued a UFS command or programmed UFS DMA. Run28 verifies only Restore-root Apple launchd PID 1; full System root, Setup and persistent Data remain unverified.", "Run33's active ACPI configuration has no IORT; only group4 SID 0x820/mask 0x402/CB4 is valid and belongs to MDSS SDE. The stock XBL-embedded IORT table has an invalid header checksum but maps UFS0 input IDs 0 and 0x10 to candidate stream IDs 0x4E0 and 0xE0 at SMMU node 0x30; these are not validated as live IDs. Run33 CB0–5 reads are recorded, while CB6–73 return high-bit nonzero SCTLR values that do not establish free/owned banks. Keep UFS commands and DMA disabled pending live route, context ownership, and complete DMA-range proof.", "Recovery ADB on active slot _b exported xbl_b, xbl_config_b, abl_b, and imagefv_b read-only; each active partition's prefix exactly matches its supplied ROM image. The active XBL contains literal EnableUfsIOC=0 and UfsSmmuConfigForOtherBootDev=1 strings, but their semantics do not establish live UFS DMA mode. Generic upstream SM8250 DTS declares candidate UFS SIDs 0xE0 and 0x4E0; the elish runtime FDT/ACPI still does not prove the route. Full hashes and commands are in reports/elish-ufs-active-firmware-20261125.md.",
  "Run35 adds passive transfer/task request-list base, run/stop and doorbell samples after checking core reset, power and clocks. Firmware and packaging checks passed. Queue ownership and DMA reachability remain unverified.",
  "The Recovery FDT and merged stock elish DTB place UFS SID candidates 0xE0 and 0x4E0 in the declared ANOC1 and ANOC2 TBU ranges respectively. The UFS interconnect vote uses the ANOC1 master. The TBU registers are outside the current UEFI SMMU MMIO descriptor. See reports/elish-ufs-active-firmware-20261125.md. Live route and DMA ownership remain unresolved.",
  "Run36 identified the inherited unshared UFS stream matches SID 0x4E0 to CB2 and SID 0xE0 to CB3 before Kona SEC detaches non-display clients. These match the active-slot XBL firmware ARIDs 0 and 0x10.",
  "Run37 sampled the idle UFS queues and allocated three contiguous pages below 4 GiB. Run38 fixed the Kona library flags and verified that both exact routes persist into DXE with stage-1 translation disabled and stage 2 bypassed. The bounded NOP probe rechecks routes and queue state before descriptor DMA.",
  "Run40 passed bounded NOP, READ CAPACITY(10), a known-block read and primary/backup GPT reads through an elish UFS data PRD at 0x9A71B000–0x9A720000. Capacity is 61,880,320 4 KiB blocks; all GPT CRCs and userdata bounds matched the Android baseline. The probe stopped before DarwinBoot, with queues idle, doorbell 0 and no new SMMU fault. See reports/elish-run40-ufs-gpt-20261126.md.",
  "The diagnostic --ufs-run-kernel mode selects SEC route retention and enters DarwinBoot without issuing UFS commands. Runs 43 and 44 reached the XNU UFS probe using this mode.",
  "Run42 used the qualified UEFI transport to sample six native LBAs from the planned manifest, OS and SystemOS windows. All CRCs matched the Android LUN and partition reads. The target image signatures are absent at those LBAs. Both GPT copies passed and the probe stopped its queue with unchanged SMMU faults before DarwinBoot.",
  "The XNU probe uses the elish run40 controller and SMMU observations to qualify inherited state, then adopts the idle transfer list with a single slot backed by XNU-owned, physically contiguous memory below 4 GiB. Only NOP, READ CAPACITY and READ(10) are constructed. The elish-ufs-probe=1 argument selects a terminal checkpoint after known-block reads and queue stop.",
  "Run43 reached the board-owned XNU UFS service. Its SMMU guard stopped before DMA allocation or queue takeover. The register diagnostic build reports the first MMIO mismatch and uses the UEFI reference access width for TTBR0.",
  "Run44 stopped at the sCR0 guard before allocating DMA or taking over the transfer list. The 32-bit read returned 0x00230406, as seen in run35 DXE and run36 SEC. It differed from run40 only at MemAttr bit 18. MTCFG was clear in both values. The next probe permits that bit to vary and still requires exact UFS route ownership, initial faults and idle queues.",
  "Run45 passed the exact SMMU route and queue guards, allocated XNU DMA pages, took over the transfer list, and stopped during READ CAPACITY submission or response validation. The list stopped with no change to SMMU fault status. Wire-layout comparison found that the diagnostic put Task Tag at byte 2 instead of byte 3, making the SCSI LUN 0x38 and comparing a reserved byte in NOP IN. The corrected probe validates the proper UPIU fields and logs command completion state.",
  "Run46 passed NOP, native LUN 0 capacity and all seven known-block CRCs using XNU-owned DMA at 0xD0132000. The queue stopped with unchanged SMMU fault status.",
  "Run47 passed both GPT capture checks and read userdata using the same XNU transport. It stopped at the missing SHNGROOT manifest with the queue stopped and fault status unchanged. The payload matches the target System UUID, and both linked IOStorageFamily vtables passed their ABI checks.",
  "Run48 disassembly exposed missing PSCI and counter instructions. Run49 corrected assembly delimiters and returned to fastboot automatically. Run50 used the firmware-prepared warm reset and recovered 80,997 bytes of console ramoops, including the XNU manifest guard and stopped queue state.",
  "Recovery root ADB on slot _b exported the exact 9,382,658,048-byte userdata prefix while /data was offline. An independent whole-LUN read matched the complete SHA-256. Both GPT captures and the first block beyond the prefix remained byte-identical.",
  "Run50 Recovery preflight verified the current offline userdata prefix against the complete replacement backup SHA-256 fcc2fc25384f6e69d6deb2f33a5c3c30acf47e5b46ae0e102aea7922703e2b78. Both GPT captures and the first block after LBA 8909823 matched the run42 guards.",
  "Run51 verified the installed 21H461 prefix by independent cache-cleared whole-LUN readback and checked both GPT captures and the first block outside the write range. The screen shows BSD's post-mount root authentication panic before Apple launchd.",
  "The kernel build anchors both pinned IPSW window digest tables with a linked SHA-256. DarwinBoot supplies the tables through the ADT RootPolicies extent. The UFS service verifies CPU-owned 32 KiB chunks before delivery and binds root authorization to the actual read-only APFS device, target UUID and UFS provider.",
  "The first verified-read image, run52, reached the visual pre-MMU marker. The digest tables shifted __TEXT_EXEC by 0x8bc000. Run53 places the tables in __LASTDATA_CONST and restores the run51 __TEXT_EXEC start and size in the host-built image.",
  "Run54 verified the installed root layout and read the first and last native blocks of the candidate Data store at LUN 0 LBA 60,821,714–61,608,170. The CRC32 was c71c0011 at each boundary. The queue stopped and SMMU fault state was unchanged.",
  "Run54 records a backup and rollback procedure for the candidate Data window, including the 3,221,327,872-byte backup length, independent readback through the LUN and partition devices, and both adjacent-block guards. Recovery execution and write approval are pending.",
  "Run55 reached PID 1 dyld startup with the RootPolicies handoff. Camera frame 84 s shows initproc failed to start and a library load failure. Device returned to bootloader fastboot.",
  "Run56 enables CONFIG_XNU_OWNER_UNION_SYSTEMOS. At the PID 1 checkpoint XNU verified the read-only UFS System-root device /dev/disk3s1, APFS UUID 04769D26-2CA0-4825-B443-E2E5F88300F2, and its SystemOS union /dev/disk1s1. Apple launchd reached main as PID 1.",
]
completion = ["Controller and DMA facts match hardware; capacity/GPT and known reads are correct; OS/SystemOS mount; Data writes survive the specified restart and recovery checks."]
limits = ["Setup is untested. Run56 has no Data seed and stops at the PID 1 checkpoint.", "Data persistence is untested. Only the candidate window endpoints have been sampled. The elish UFS service exposes read-only OS and SystemOS windows."]
next_action = ["Test Setup Assistant with an unconfigured writable Data seed of at most 2 GiB logical capacity, its observed APFS UUID and the terminal PID 1 checkpoint disabled.", "Verify the candidate window backup, independent readback and rollback plan. Get approval for the exact write range before enabling writes. Confirm a synced marker survives restart on the same Data volume."]
evidence = [{kind = "host", reference = "reports/elish-userdata-build-20261124.md", result = "Built and read-back verified the 8.74 GiB SHNGROOT host image from the pinned 21H461 IPSW. Verified the APFS System-role volume UUID against board.toml. The board configuration was an uncommitted working-tree input. The image has not been flashed or tested through elish UFS.", command = "./unixnu build userdata -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461 --ipsw /root/elish-build-20261123/UniXNU/.cache/firmware/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed stock vendor_boot v3, selected DTBO entry 12 by elish model and board ID, merged it into the Kona v2.1 base DTB, and recorded UFS/PHY resources. Compared the stock properties with the pinned ShengUfs source scope. No device access was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "2b6638be3e5630969e316dd1755065542fcee505"}, {kind = "host", reference = "reports/elish-stock-storage-audit-20261124.md", result = "Parsed the stock vendor_boot v3 DTB set, selected the elish overlay by board ID, reviewed UFS/PHY resources and compared official and community driver scope. No device command was run.", command = "fdtoverlay -i /tmp/elish-stock-dtb-0.dtb -o /tmp/elish-stock-elish-merged.dtb /tmp/elish-stock-overlay-12.dtbo", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Reviewed NativeUfs-alioth source at the pinned revision. The SM8250 stream values are alioth-specific, the default remains 0x60, and the clock/reset/PHY inputs are not established for elish. No driver was enabled or integrated.", command = "git -C /tmp/elish-NativeUfs-alioth rev-parse HEAD && rg -n 'SM8250|0xe0|0x4e0|qcom,ufshc|GCC|reset|QMP' /tmp/elish-NativeUfs-alioth", revision = "336680c353e6c3f25d6b29284532c4fd16104f68"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "Compared pinned Linux v6.6 SM8250 GCC and UFS PHY definitions with NativeUfs-alioth's GccUfs.h and the stock elish DT clock/reset specifiers. Several alioth register offsets differ from the SoC source, and the vendor overlay clock IDs do not directly match the upstream binding. No UFS code was enabled.", command = "sha256sum /tmp/elish-gcc-sm8250.c /tmp/elish-linux-qcom,gcc-sm8250.h /tmp/elish-linux-phy-qcom-qmp-ufs.c", revision = "166235ec2480ff0992627b7aafa15c65ce6b4efa"}, {kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "The elish stock UFSDxe PE32 exactly matches alioth and pipa catalog binaries. The shared catalog DEPEX protocol GUIDs were traced to SmemDxe and SPMIDxe InstallMultipleProtocolInterfaces calls. Elish SmemDxe, SPMI, NpaDxe and UFSDxe PE32 hashes match pipa/alioth catalog copies. NpaDxe installs the GUID queried by UFSDxe. Board initialization inputs remain open. Details and additional module hashes are in reports/elish-offline-audit-20261124.md.", command = "JAVA_HOME=/opt/jdk-25 PATH=/opt/jdk-25/bin:$PATH /opt/ghidra-12.2/ghidra_12.2_PUBLIC/support/analyzeHeadless /tmp/elish-ghidra-projects ElishUfs -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/UFSDxe/UFSDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SmemDxe/SmemDxe.efi -import /root/repo/uefi-elish/Binaries/alioth/QcomPkg/Drivers/SPMIDxe/SPMIDxe.efi -overwrite -analysisTimeoutPerFile 180 -max-cpu 8 -scriptPath /tmp/elish-ghidra-scripts -postScript AuditUfsProtocols.java", revision = "66421cb7bb5694843aec8de1ca3d1de4c20cca38"}, { kind = "host", reference = "reports/elish-smmu-readonly-probe-20261125.md", result = "Built the opt-in read-only SMMUv2 diagnostic image; build passed, device execution is pending.", command = "python3 scripts/build-loader-probe.py --smmu-readonly --payload /root/elish-build-20261123/UniXNU/out/elish-resume/elish/ipados-17.7.11-21H461/elish/payload/payload.img --dtb /tmp/elish-uefi-probe.dtb --out /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run06-smmu-readonly --clang-bin /usr/lib/llvm-21/bin --jobs 8", revision = "f03839d31a3f07e9e4b032fcf850ac0dfb9961a0" }, { kind = "host", reference = "reports/elish-ufs-uefi-arid-audit-20261125.md", result = "Ghidra corrected the UFS/SDCC protocol GUID, matched the stock elish HALIOMMUDxe provider to the catalogs, and confirmed that the provider resolves ARIDs through ACPI IORT. The live elish mapping and run11 SID owner remain unknown.", command = "Ghidra 12.2 analyzeHeadless with AuditGuidXrefs.java at 0x19248, 0x17268 and 0x9048; see report for full commands and module extraction.", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905" }, {kind = "device", reference = "reports/elish-live-ufs-smmu-20261125.txt", result = "Read-only root ADB on elish confirms ufshcd-qcom, no UFS iommu_group link, and arm_smmu disable_bypass=Y. dmesg reports host/PHY reinitialization and Gear 1 one lane SLOWAUTO followed by Gear 4 two-lane FAST. This does not identify the UFS stream or DMA path. Capture SHA-256: 95402cb216f86c2c576ddbfed47d97def68b7b64ffd53efe90fc406362c09e56.", command = "adb -s 4bed07e4 shell cat /sys/module/arm_smmu/parameters/disable_bypass; adb -s 4bed07e4 shell readlink /sys/devices/platform/soc/1d84000.ufshc/driver; adb -s 4bed07e4 shell dmesg", revision = "4b3da68ea0aca815a80e8d1bad802dfec8d5c905"}, {kind = "device", reference = "reports/elish-restore-root-20261125.md", result = "Run28 RAM-booted the 21H461 restore APFS root through RamBlock. The recording shows the cyan marker painted only after PID 1 successfully writes kern.initproc_spawned=1. Apple launchd reached main. The full System root and persistent Data remain unverified.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run28-restore-launchd-cyan/boot.img", revision = "24de4f60e84762378ce9b1e906b86827b1b2121c"},
  { kind = "device", reference = "reports/elish-run34-android-kernel-20261126.md", result = "Fastboot accepted run34 and USB disconnected. After manual fastboot entry, the verified reader stalled at Sending. The bootloader accepted bulk OUT bytes but returned no bulk IN response after host USB reset. No SMMU/UFS values were recovered.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run34-android-smmu-diagnostic/boot.img", revision = "6b34d24765327d746074c8e53b5ad0d24a51acc7" },
  { kind = "host", reference = "reports/elish-run35-ufs-queues-20261126.md", result = "Built and packaged the passive UEFI UFS queue snapshot. Hardware execution is pending.", command = "python3 scripts/build-loader-probe.py --ufs-clocks-readonly (full arguments in report)", revision = "f0b9d57f5088f80f7055e80599cb80a0d3877db3" },
  { kind = "host", reference = "reports/elish-ufs-active-firmware-20261125.md", result = "Compared elish Recovery and stock TBU SID ranges and identified the UFS interconnect bandwidth-vote path. The live route and DMA ownership remain unresolved.", command = "fdtget -t x reports/elish-recovery-fdt-20261124.dtb /soc/apps-smmu@15000000/anoc_1_tbu@15185000 qcom,stream-id-range (full commands in report)", revision = "f0b9d57f5088f80f7055e80599cb80a0d3877db3" },
  { kind = "device", reference = "reports/elish-run36-sec-smmu-20261126.md", result = "Captured both exact UFS stream matches, CB2 and CB3, before SEC detached the inherited routes.", command = "python3 scripts/build-loader-probe.py --sec-smmu-readonly (full build and fastboot commands in report)", revision = "f0b9d57f5088f80f7055e80599cb80a0d3877db3" },
  { kind = "device", reference = "reports/elish-run37-ufs-handoff-20261126.md", result = "Run37 reached DXE and reserved three contiguous low pages. The Kona library flag was absent and DXE observed only the MDSS route.", command = "fastboot -s 4bed07e4 boot run37-ufs-handoff-readonly/boot.img", revision = "d489a050255f90b9c011d25b95c15c1b12f382f0" },
  { kind = "device", reference = "reports/elish-run38-ufs-handoff-20261126.md", result = "Run38 carried SID 0x4E0 to CB2 and SID 0xE0 to CB3 through SEC into DXE, with both stages bypassed and a low DMA reservation. It issued zero UFS commands.", command = "fastboot -s 4bed07e4 boot run38-ufs-handoff-library-flag/boot.img", revision = "d489a050255f90b9c011d25b95c15c1b12f382f0" },
  { kind = "device", reference = "reports/elish-run40-ufs-gpt-20261126.md", result = "RAM-only elish probe passed NOP, READ CAPACITY(10), known-block DMA read and primary/backup GPT CRC validation. Native LUN 0 reports 61,880,320 4096-byte blocks; userdata bounds match Android. It stopped before DarwinBoot and performed no partition writes.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run40-ufs-gpt/boot.img", revision = "f0b9d57f5088f80f7055e80599cb80a0d3877db3" },
  { kind = "device", reference = "reports/elish-run42-ufs-root-windows-20261126.md", result = "Six planned userdata LBAs matched the Android baseline. SHNGROOT and APFS signatures were absent. Both GPT copies passed and the idle queue stopped before DarwinBoot.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run42-ufs-root-windows-rebuilt-20261126/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run43-xnu-ufs-20261126.md", result = "The RAM-only probe reached ElishUfsProbe::start and stopped at the SMMU guard before DMA allocation and queue takeover.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run43-xnu-ufs-20261126/boot/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run44-xnu-ufs-20261126.md", result = "The RAM-only XNU probe stopped at sCR0=0x00230406 before DMA allocation. The only differing bit is in MemAttr and MTCFG is clear.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run44-xnu-ufs-registers-20261126/boot/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run45-xnu-ufs-20261126.md", result = "XNU qualified both routes, transferred the idle list to its own DMA pages, and stopped at READ CAPACITY. The queue stopped with unchanged SMMU fault state.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run45-xnu-ufs-known-reads-20261126/boot/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run46-xnu-ufs-upiu-20261126.md", result = "XNU-owned UFS DMA passed NOP, READ CAPACITY(10), and seven known-block CRCs. The queue stopped with unchanged SMMU faults.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run46-xnu-ufs-upiu-20261126/boot/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run47-xnu-ufs-root-20261126.md", result = "XNU qualified both GPT copies and rejected the absent SHNGROOT manifest before block publication. The queue stopped with unchanged SMMU faults. The user returned to fastboot manually.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run47-xnu-ufs-root-20261126/boot/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run50-xnu-system-checkpoint-20261126.md", result = "XNU stopped at the missing SHNGROOT guard with the UFS queue stopped and unchanged SMMU faults. Warm reboot returned to fastboot and the RAM-only reader exported the XNU ramoops record.", command = "fastboot -s 4bed07e4 boot /tmp/elish-run50-xnu-system-checkpoint-20261126/boot/boot.img, then RAM-boot the Lineage reader and export console-ramoops-0", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run51-system-root-auth-20261126.md", result = "The installed image matched on complete independent readback. The RAM-only boot reached the post-mount BSD root authentication check, then reported a panic on screen and returned to fastboot.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run51-xnu-system-installed/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run52-verified-system-20261126.md", result = "First kernel with both digest tables reached the pre-MMU mark on the camera. The ADB reader appeared unauthorized, so no later XNU stage was verified.", command = "fastboot -s 4bed07e4 boot /root/elish-build-20261123/UniXNU/out/elish-darwinboot-20261125/run52-verified-system/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run53-verified-system-layout-20261126.md", result = "Run53 with chunk tables in LASTDATA_CONST reached the pre-MMU marker in the 80-second frame and returned to bootloader fastboot.", command = "fastboot -s 4bed07e4 boot run53-verified-system-layout/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run54-ufs-data-readonly-20261126.md", result = "XNU read both candidate Data window boundaries with CRC32 c71c0011, stopped the queue and observed unchanged SMMU faults.", command = "fastboot -s 4bed07e4 boot run54-ufs-data-readonly/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run55-verified-system-handoff-20261126.md", result = "The RootPolicies build passed host checks and reached PID 1 dyld startup. At 84 s the screen showed initproc failed to start with a library load error.", command = "fastboot -s 4bed07e4 boot run55-verified-system-handoff/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
  { kind = "device", reference = "reports/elish-run56-verified-systemos-union-20261126.md", result = "The framebuffer confirmed the full System APFS UUID and both verified mounts. Apple launchd reached main as PID 1, and the tablet returned to bootloader fastboot.", command = "fastboot -s 4bed07e4 boot run56-verified-systemos-union/boot.img", revision = "2561162a380f3570f5e9cb8360a74603e23bf691" },
]

[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/**", "dts/elish.dts", "configs/**"]
inputs = ["Root ADB reports DRM connector card0-DSI-1 connected at 1600x2560 and modes of 120, 60 and 30 Hz. The kernel identifies the active panel as `xiaomi 42 02 0a video mode dual dsi cphy panel`; its raw backlight has maximum value 2047. The live touch properties are panel_vendor=S, panel_display=B and touch_vendor=4.", "The live FDT enables `/soc/spi@990000/novatek@0` as `novatek,NVT-ts-spi`, chip select 0, 19.2 MHz, TLMM IRQ GPIO 39. Android logs report a successful NT36523 firmware update from `novatek_nt36523_k81a_fw01.bin`, version 0x1a, controller PID 5961. Full reads are recorded in reports/elish-live-hardware-20261123.md."]
configuration = ["No display driver or board peripheral is enabled in stage 1."]
procedure = ["First inspect any firmware framebuffer without panel writes; identify the fitted panel before implementing display or backlight control."]
findings = ["Stock DTBO source distinguishes elish board ID 47 from enuma board ID 46. Root ADB and the runtime DRM/Novatek logs identify this unit's K81 42_02_0a panel and the active NT36523 fw01 image with PID 5961. The earlier static ROM-only inventory could not distinguish these variants.", "Run28 and run56 show the firmware framebuffer through the XNU checkpoint for Apple PID 1. The run56 capture contains the mounted System and SystemOS device names."]
completion = ["A known frame has correct geometry and colors; presentation and brightness control work across repeated boots."]
limits = ["Native display presentation, panel transitions and brightness control are untested."]
next_action = ["Adapt and test the measured panel and backlight path."]
evidence = []

