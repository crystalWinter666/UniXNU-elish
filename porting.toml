id = "gpu"
status = "planned"
components = []
paths = ["package/**", "configs/**", "dts/**"]
inputs = ["SM8250-AC is the Adreno 650 platform; the pinned SoC package is a candidate source for A650 GMU support."]
configuration = ["No GPU component is selected in stage 1. Do not use the Adreno 740/SM8550 kit."]
procedure = ["Defer GPU work until storage, display, memory ownership, firmware and SMMU paths are stable."]
findings = ["A compatible SoC package or source implementation is not proof of elish GPU operation."]
completion = ["GPU submissions, memory mapping, fences and a known Metal-rendered image pass on hardware."]
limits = ["No GPU firmware, power policy or XNU/Metal execution has been validated on elish."]
next_action = ["Keep GPU disabled until the earlier bring-up stages are verified."]
