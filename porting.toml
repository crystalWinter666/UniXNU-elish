[[area]]
id = "packaging"
status = "device-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["patches/unixnu-build-support.patch", "scripts/package.sh", "scripts/build-link-stubs.py", "scripts/build-platform-power.py", "package/**", "board.toml", ".github/workflows/package.yml", "PLAN.md", "HANDOFF.md", "reports/elish-offline-audit-20261124.md", "reports/elish-ipados-host-image-20261124.md"]
inputs = ["Target profile is iPadOS 17.7.11/21H461. The cached IPSW SHA-256 is c84ad24b6981a859eec499b1802be9ac593acfd3dc0a185a76d06e4d767a1451. The supplied stock boot and vendor_boot use Android header v3; their hashes are recorded in HANDOFF.md. The generated Android v3 image was accepted by elish bootloader through RAM-only fastboot boot.", "A nonzero 8-hex software identity seed was generated and stored as `unique_chip_id` in the git-ignored `/root/elish-build-20261123/UniXNU/unixnu.local.toml` with mode 0600. The value is omitted from tracked files and logs and must stay stable for subsequent builds."]
configuration = ["The shared packaging command now builds the iPadOS payload and Android v3 boot image from the runtime-managed board configuration. Build metadata continues to mark hardware testing false."]
procedure = ["Ran `./unixnu build kernel -D /root/repo/UniXNU-elish --os ipados-17.7.11-21H461` on Linux; XNU compile and XnuPrelink completed. Ran `./scripts/package.sh --check --os ipados-17.7.11-21H461`; dependency, IPSW-input, defconfig and 62-patch checks completed. The package wrapper was run with a temporary sibling symlink to the core checkout because the current workspace directories are not adjacent.", "Added support in core scripts/unixnu/bootimg.py for the documented boot_image_kernel.kernel_compression and append_dtb settings. Ran scripts/unixnu/test_bootimg.py and scripts/unixnu/test_boot_template.py on the core worktree based on revision 71c5c6569bae6369c0e0f634df8b9bd5afc19139. These core changes are uncommitted.", "The firmware-only probe image and its hash are recorded in the firmware area. Capture the UEFI runtime memory map before preparing an iPadOS payload; device-side probe execution remains pending.", "Recreated and retained /root/repo/UniXNU as a symlink to the core checkout. The normal device-repository entrypoint scripts/package.sh --check --os ipados-17.7.11-21H461 passed and resolved 62 patches without building a payload or final image.", "Ran ./scripts/package.sh --no-deps --os ipados-17.7.11-21H461 --uefi /root/repo/uefi-elish. The build resolved 63 patches and rebuilt XNU, payload, firmware and the Android v3 image.", "Ran the boot-image round-trip verifier, bootimg and boot-template tests, all 65 XnuPrelink tests, the production DarwinBoot Mach-O parser test and the 14-area porting-record check.", "Ran `fastboot -s ELISH_SERIAL boot .../boot.img` on the authorized elish. The bootloader accepted the 67,727,360-byte image. Android ADB reappeared about five seconds later, with no captured UEFI, DarwinBoot or XNU output. Full hashes and qualification limits are in reports/elish-ipados-host-image-20261124.md."]
findings = ["The published package workflow uses the pinned elish firmware and applies the device build support patch to the pinned public UniXNU revision. Boot image and boot template host tests passed with that patch applied.", "The host build produced kernel.macho at /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/kernel/kernel.macho (51,122,176 bytes, SHA-256 7ab7c4c90647e17ae1a301117fc3e067616431a17b164a5ef01b0867603605b2). Its kernel.json records instruction_relocation_complete=false, register_dataflow_qualified=false, runtime_qualified=false, abi_qualified=false and loadable=false. These qualifications remain false and the candidate is experimental.", "scripts/package.sh has its executable bit set. The configured sibling core path is provided by /root/repo/UniXNU, a symlink to the current core checkout, so scripts/package.sh works from the device repository.", "The core boot-image builder now honors the device configuration's kernel compression and optional DTB append settings and verifies both choices by round trip.", "The 64 MiB iPadOS payload and 67,727,360-byte Android v3 boot image pass the host unpack-and-compare check. Fastboot accepted the current image, verifying transport format and size. Android reappeared about five seconds later, so iPadOS startup has not been verified.", "The current prelink candidate has 260779 inventoried PC-relative encodings, 69294 pointer bindings and 119 extents, but all relocation, register-dataflow, ABI, runtime and loadability qualification fields remain false. At the pinned core revision the emitters set these fields false by design; report edits do not supply the missing proof.", "Both the target IPSW kernelcache.decompressed and the current kernel.macho candidate are Mach-O MH_EXECUTE. The XnuPrelink file-set emitter requires MH_FILESET input and does not cover this target path. The current ordinary emitter still leaves instruction relocation, register-dataflow, ABI, runtime and loadability qualification false."]
completion = ["Kernel/prelink and firmware build; payload/ADT are internally consistent; image format and size are accepted by the bootloader in an authorized test."]
limits = ["UEFI/XNU memory ownership, kernel relocation/ABI/runtime qualification, UFS/APFS root-volume startup and device boot remain unverified. The host payload and image manifests correctly report hardware_tested=false."]
next_action = ["Continue XNU loadability qualification and SM8250 UFS/APFS integration. Use the captured HOB evidence to review the runtime-managed memory handoff, then test the exact host-built image on elish when device validation resumes."]
evidence = [
  { kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "XnuPrelink's 65 host tests passed. Source review confirms relocation, register dataflow, ABI, runtime and loadability remain unqualified.", command = "python3 -m unittest discover -s kits/XnuPrelink -p 'test_*.py'", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" },
  { kind = "host", reference = "reports/elish-offline-audit-20261124.md", result = "The generated kernel passes DarwinBoot's production Mach-O parser, including LC_UNIXTHREAD entry and the loader-window bounds.", command = "python3 drivers/DarwinBoot/Test/test-kernel-parser.py out/elish/ipados-17.7.11-21H461/elish/kernel/kernel.macho", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" },
  { kind = "host", reference = "reports/elish-ipados-host-image-20261124.md", result = "The current package command built and verified the 64 MiB payload and 67,727,360-byte Android v3 image. Kernel metadata still has loadable=false and hardware_tested=false.", command = "./scripts/package.sh --no-deps --os ipados-17.7.11-21H461 --uefi /root/repo/uefi-elish", revision = "71c5c6569bae6369c0e0f634df8b9bd5afc19139" },
  { kind = "device", reference = "reports/elish-ipados-host-image-20261124.md", result = "Elish bootloader accepted the RAM-only image. Android USB enumeration returned about five seconds later without captured UEFI, DarwinBoot or XNU output.", command = "fastboot -s ELISH_SERIAL boot /root/elish-build-20261123/UniXNU/out/elish/ipados-17.7.11-21H461/elish/boot/boot.img", revision = "208b47d20e87d3876fd862bb1f0ee0c17467b0c2" },
]

